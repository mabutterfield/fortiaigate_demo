---
- name: Skip LiteLLM deployment when disabled
  ansible.builtin.debug:
    msg: "litellm_enabled=false; skipping LiteLLM deployment."
  when: not litellm_enabled | bool

- name: Validate demo configuration source
  ansible.builtin.assert:
    that:
      - demo_configuration_source in ['scenario_matrix', 'legacy']
    fail_msg: "demo_configuration_source must be scenario_matrix or legacy."
  when: litellm_enabled | bool

- name: Build installed scenario matrix on the controller
  ansible.builtin.command:
    argv: >-
      {{
        [
          ansible_playbook_python,
          scenario_matrix_builder_path,
          '--faig-chain-reentry-uri',
          litellm_faig_backend_base_path
        ]
        + (
          []
          if faig_chain_capability_enabled | bool
          else ['--disable-faig-chain']
        )
      }}
  changed_when: false
  check_mode: false
  register: scenario_matrix_builder_result
  delegate_to: localhost
  become: false
  when:
    - litellm_enabled | bool
    - demo_configuration_source == 'scenario_matrix'
  # - ansible.builtin.debug:
  #     var: scenario_matrix_builder_result.stdout_lines

- name: Set installed scenario matrix fact
  ansible.builtin.set_fact:
    scenario_matrix_runtime: "{{ scenario_matrix_builder_result.stdout | from_json }}"
  when:
    - litellm_enabled | bool
    - demo_configuration_source == 'scenario_matrix'
  # - ansible.builtin.debug:
  #     var: scenario_matrix_runtime

- name: Set LiteLLM Ollama model list facts
  ansible.builtin.set_fact:
    litellm_primary_ollama_model: "{{ ollama_model | default((ollama_models | first), true) }}"
    litellm_configured_ollama_models: "{{ ollama_models | default([ollama_model], true) }}"
  when:
    - litellm_enabled | bool
    - litellm_use_ollama_model_list | bool
  # - ansible.builtin.debug:
  #     msg:
  #       primary: "{{ litellm_primary_ollama_model }}"
  #       models: "{{ litellm_configured_ollama_models }}"

- name: Build LiteLLM Ollama demo aliases
  ansible.builtin.set_fact:
    litellm_ollama_model_entries:
      - name: "{{ litellm_passthrough_model_alias }}"
        provider_model: "ollama_chat/{{ litellm_primary_ollama_model }}"
        api_base: "{{ litellm_ollama_base_url }}"
        instruction_profile: passthrough
      - name: "{{ litellm_demo_a_model_alias }}"
        provider_model: "ollama_chat/{{ litellm_primary_ollama_model }}"
        api_base: "{{ litellm_ollama_base_url }}"
        instruction_profile: demo-a
      - name: "{{ litellm_demo_b_model_alias }}"
        provider_model: "ollama_chat/{{ litellm_primary_ollama_model }}"
        api_base: "{{ litellm_ollama_base_url }}"
        instruction_profile: demo-b
      - name: "{{ litellm_demo_a_faig_be_model_alias }}"
        provider_model: "openai/{{ litellm_faig_backend_downstream_model }}"
        api_base: "{{ litellm_faig_backend_base_url }}"
        api_key: "{{ litellm_faig_backend_api_key }}"
        instruction_profile: demo-a
      - name: "{{ litellm_demo_b_faig_be_model_alias }}"
        provider_model: "openai/{{ litellm_faig_backend_downstream_model }}"
        api_base: "{{ litellm_faig_backend_base_url }}"
        api_key: "{{ litellm_faig_backend_api_key }}"
        instruction_profile: demo-b
  when:
    - litellm_enabled | bool
    - litellm_use_ollama_model_list | bool
    - demo_configuration_source == 'legacy'
  # - ansible.builtin.debug:
  #     var: litellm_ollama_model_entries

- name: Add configured Ollama models to LiteLLM model list
  ansible.builtin.set_fact:
    litellm_ollama_model_entries: >-
      {{
        litellm_ollama_model_entries
        + [
          {
            'name': item,
            'provider_model': 'ollama_chat/' ~ item,
            'api_base': litellm_ollama_base_url,
            'instruction_profile': 'passthrough'
          }
        ]
      }}
  loop: "{{ litellm_configured_ollama_models }}"
  when:
    - litellm_enabled | bool
    - litellm_use_ollama_model_list | bool
    - demo_configuration_source == 'legacy'
  # - ansible.builtin.debug:
  #     var: litellm_ollama_model_entries

- name: Use generated LiteLLM Ollama model list
  ansible.builtin.set_fact:
    litellm_models: "{{ litellm_ollama_model_entries }}"
  when:
    - litellm_enabled | bool
    - litellm_use_ollama_model_list | bool
    - demo_configuration_source == 'legacy'
  # - ansible.builtin.debug:
  #     var: litellm_models

- name: Validate LiteLLM deployment settings
  ansible.builtin.assert:
    that:
      - litellm_namespace | length > 0
      - litellm_release_name | length > 0
      - litellm_chart_local_path is directory
      - litellm_master_key | length > 0
      - litellm_ui_username | length > 0
      - litellm_ui_password | length > 0
      - litellm_postgres_password | length > 0
    fail_msg: "LiteLLM requires namespace/release, chart path, master/admin keys, and Postgres password."
  when: litellm_enabled | bool

- name: Install Helm when missing
  ansible.builtin.shell: |
    set -euo pipefail
    if ! command -v helm >/dev/null 2>&1; then
      curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
    fi
  args:
    executable: /bin/bash
    creates: /usr/local/bin/helm
  when: litellm_enabled | bool

- name: Read LiteLLM Bedrock model IDs from Terraform
  ansible.builtin.command:
    argv:
      - terraform
      - "-chdir={{ litellm_bedrock_module_path }}"
      - output
      - -json
      - bedrock_model_ids
  changed_when: false
  failed_when: false
  register: litellm_bedrock_models_raw
  delegate_to: localhost
  become: false
  when:
    - litellm_enabled | bool
    - litellm_bedrock_enabled | bool
    - litellm_bedrock_use_terraform_output | bool
  # - ansible.builtin.debug:
  #     var: litellm_bedrock_models_raw.stdout_lines

- name: Read LiteLLM Bedrock region from Terraform
  ansible.builtin.command:
    argv:
      - terraform
      - "-chdir={{ litellm_bedrock_module_path }}"
      - output
      - -raw
      - bedrock_region
  changed_when: false
  failed_when: false
  register: litellm_bedrock_region_raw
  delegate_to: localhost
  become: false
  when:
    - litellm_enabled | bool
    - litellm_bedrock_enabled | bool
    - litellm_bedrock_use_terraform_output | bool
  # - ansible.builtin.debug:
  #     var: litellm_bedrock_region_raw.stdout_lines

- name: Set LiteLLM Bedrock model list fact
  ansible.builtin.set_fact:
    litellm_bedrock_model_ids: >-
      {{
        (
          (litellm_bedrock_models_raw.stdout | from_json) | default([], true)
        )
        if (
          litellm_bedrock_models_raw is defined
          and litellm_bedrock_models_raw.rc == 0
          and litellm_bedrock_models_raw.stdout | default('', true) | length > 0
        )
        else []
      }}
  when:
    - litellm_enabled | bool
    - litellm_bedrock_enabled | bool
  # - ansible.builtin.debug:
  #     var: litellm_bedrock_model_ids

- name: Set LiteLLM Bedrock facts
  ansible.builtin.set_fact:
    litellm_effective_bedrock_region: >-
      {{
        litellm_bedrock_region | default('', true) | trim
        if litellm_bedrock_region | default('', true) | trim | length > 0
        else (
          litellm_bedrock_region_raw.stdout | trim
          if (
            litellm_bedrock_region_raw is defined
            and litellm_bedrock_region_raw.rc == 0
            and litellm_bedrock_region_raw.stdout | default('', true) | length > 0
          )
          else aws_region | default("us-east-1")
        )
      }}
    litellm_effective_bedrock_model_id: >-
      {{
        litellm_bedrock_model_id | default('', true) | trim
        if litellm_bedrock_model_id | default('', true) | trim | length > 0
        else (
          litellm_bedrock_model_ids[0]
          if (
            litellm_bedrock_model_ids | length > 0
          )
          else litellm_bedrock_fallback_model_id | default('openai.gpt-oss-20b-1:0', true)
        )
      }}
  when:
    - litellm_enabled | bool
    - litellm_bedrock_enabled | bool
  # - ansible.builtin.debug:
  #     var: litellm_effective_bedrock_model_id

- name: Validate scenario matrix provider settings
  ansible.builtin.assert:
    that:
      - (litellm_use_ollama_model_list | bool) or (litellm_bedrock_enabled | bool)
    fail_msg: "Scenario matrix llm-default requires either the Ollama or Bedrock LiteLLM provider."
  when:
    - litellm_enabled | bool
    - demo_configuration_source == 'scenario_matrix'

- name: Set scenario matrix default LLM target
  ansible.builtin.set_fact:
    scenario_matrix_default_llm_target: >-
      {{
        {
          'provider_model': 'ollama_chat/' ~ litellm_primary_ollama_model,
          'api_base': litellm_ollama_base_url
        }
        if litellm_use_ollama_model_list | bool
        else {
          'provider_model': 'bedrock/' ~ litellm_effective_bedrock_model_id,
          'aws_region_name': litellm_effective_bedrock_region
        }
      }}
  when:
    - litellm_enabled | bool
    - demo_configuration_source == 'scenario_matrix'
  # - ansible.builtin.debug:
  #     var: scenario_matrix_default_llm_target

- name: Set scenario matrix effective LLM targets
  ansible.builtin.set_fact:
    scenario_matrix_effective_llm_targets: >-
      {{
        {
          'llm-default': scenario_matrix_default_llm_target,
          'faig-chain-reentry': {
            'provider_model': 'openai/' ~ litellm_faig_backend_downstream_model,
            'api_base': litellm_faig_backend_base_url,
            'api_key': litellm_faig_backend_api_key
          }
        }
        | combine(scenario_matrix_llm_target_overrides, recursive=true)
      }}
  no_log: true
  when:
    - litellm_enabled | bool
    - demo_configuration_source == 'scenario_matrix'
  # - ansible.builtin.debug:
  #     var: scenario_matrix_effective_llm_targets

- name: Validate scenario matrix LLM target references
  ansible.builtin.assert:
    that:
      - item.name in scenario_matrix_effective_llm_targets
      - scenario_matrix_effective_llm_targets[item.name].provider_model | default('') | length > 0
    fail_msg: "Scenario matrix LLM target {{ item.name }} has no provider definition."
  loop: "{{ scenario_matrix_runtime.llm_targets }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - litellm_enabled | bool
    - demo_configuration_source == 'scenario_matrix'

- name: Reset scenario matrix LiteLLM models
  ansible.builtin.set_fact:
    litellm_models: []
  when:
    - litellm_enabled | bool
    - demo_configuration_source == 'scenario_matrix'
  # - ansible.builtin.debug:
  #     var: litellm_models

- name: Build scenario matrix LiteLLM models
  ansible.builtin.set_fact:
    litellm_models: >-
      {{
        litellm_models
        + [
          scenario_matrix_effective_llm_targets[item.llm_target]
          | combine({
              'name': item.name,
              'instruction_profile': item.instruction_profile
            })
        ]
      }}
  no_log: true
  loop: "{{ scenario_matrix_runtime.litellm_models }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - litellm_enabled | bool
    - demo_configuration_source == 'scenario_matrix'
  # - ansible.builtin.debug:
  #     var: litellm_models

- name: Reset scenario matrix LiteLLM instruction profiles
  ansible.builtin.set_fact:
    litellm_instruction_profiles: []
  when:
    - litellm_enabled | bool
    - demo_configuration_source == 'scenario_matrix'
  # - ansible.builtin.debug:
  #     var: litellm_instruction_profiles

- name: Resolve scenario matrix instruction profile paths
  ansible.builtin.set_fact:
    litellm_instruction_profiles: >-
      {{
        litellm_instruction_profiles
        + [
          item
          | combine({
              'source_path': scenario_matrix_repo_root ~ '/' ~ item.source_path
            })
          if (
            item.source_path is defined
            and not (item.source_path | regex_search('^/'))
          )
          else item
        ]
      }}
  loop: "{{ scenario_matrix_runtime.litellm_instruction_profiles }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - litellm_enabled | bool
    - demo_configuration_source == 'scenario_matrix'
  # - ansible.builtin.debug:
  #     var: litellm_instruction_profiles

- name: Set scenario matrix LiteLLM instruction map
  ansible.builtin.set_fact:
    litellm_model_instruction_profiles: "{{ scenario_matrix_runtime.litellm_model_instruction_profiles }}"
  when:
    - litellm_enabled | bool
    - demo_configuration_source == 'scenario_matrix'
  # - ansible.builtin.debug:
  #     var: litellm_model_instruction_profiles

- name: Validate effective LiteLLM model list
  ansible.builtin.assert:
    that:
      - litellm_models is sequence
      - litellm_models | length > 0
      - litellm_models | map(attribute='name') | list | unique | length == litellm_models | length
    fail_msg: "LiteLLM requires at least one uniquely named effective model."
  when: litellm_enabled | bool

- name: Validate scenario matrix LiteLLM contract
  ansible.builtin.assert:
    that:
      - scenario_matrix_runtime.global.passthrough_model_alias in (litellm_models | map(attribute='name') | list)
      - scenario_matrix_runtime.litellm_model_instruction_profiles[scenario_matrix_runtime.global.passthrough_model_alias] == 'passthrough'
      - litellm_faig_backend_downstream_model == scenario_matrix_runtime.global.passthrough_model_alias
      - (litellm_faig_backend_base_path | regex_replace('/$', '')) == scenario_matrix_runtime.global.faig_passthrough_uri
      - >-
        litellm_models
        | map(attribute='name')
        | select('match', '^demo-[a-z](?:-|$)')
        | list
        | length == 0
    fail_msg: "Scenario matrix LiteLLM output must include canonical passthrough and cannot generate demo-letter aliases."
  when:
    - litellm_enabled | bool
    - demo_configuration_source == 'scenario_matrix'

- name: Set configured LiteLLM instruction profile specs
  ansible.builtin.set_fact:
    litellm_configured_instruction_profiles: >-
      {{
        litellm_instruction_profiles
        if litellm_instruction_profiles | length > 0
        else [
          {
            'name': litellm_default_instruction_profile,
            'enabled': true,
            'position': litellm_instruction_profile_injection_position,
            'source_path': litellm_instruction_profile_source_path
          }
        ]
      }}
  when: litellm_enabled | bool
  # - ansible.builtin.debug:
  #     var: litellm_configured_instruction_profiles

- name: Ensure local instruction profile directories exist
  ansible.builtin.file:
    path: "{{ item.value.local_path | dirname }}"
    state: directory
    mode: "0755"
  loop: "{{ chatbot_instruction_profile_files | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  delegate_to: localhost
  become: false
  when:
    - litellm_enabled | bool
    - demo_configuration_source == 'legacy'
    - item.value.example_path is file

- name: Initialize local instruction profile files from examples
  ansible.builtin.copy:
    src: "{{ item.value.example_path }}"
    dest: "{{ item.value.local_path }}"
    mode: "0644"
    force: false
  loop: "{{ chatbot_instruction_profile_files | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  delegate_to: localhost
  become: false
  when:
    - litellm_enabled | bool
    - demo_configuration_source == 'legacy'
    - item.value.example_path is file
  # - ansible.builtin.debug:
  #     msg: "Initialized local instruction profile {{ item.key }} at {{ item.value.local_path }}"

- name: Validate configured LiteLLM instruction profile specs
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.name | length > 0
      - item.position | default('prepend') in ['prepend', 'append']
      - not (item.enabled | default(true) | bool) or (item.instruction is defined and item.instruction | length > 0) or (item.source_path is defined and item.source_path | length > 0)
    fail_msg: "Each enabled LiteLLM instruction profile needs name, position prepend/append, and either instruction or source_path."
  loop: "{{ litellm_configured_instruction_profiles }}"
  when: litellm_enabled | bool

- name: Reset effective LiteLLM instruction profiles
  ansible.builtin.set_fact:
    litellm_effective_instruction_profiles: []
  when: litellm_enabled | bool
  # - ansible.builtin.debug:
  #     var: litellm_effective_instruction_profiles

- name: Build effective LiteLLM instruction profiles
  ansible.builtin.set_fact:
    litellm_effective_instruction_profiles: >-
      {{
        litellm_effective_instruction_profiles
        + [
          item
          | combine({
              'enabled': item.enabled | default(true),
              'position': item.position | default('prepend'),
              'instruction': (
                ''
                if not (item.enabled | default(true) | bool)
                else (
                  item.instruction
                  if (item.instruction is defined and item.instruction | length > 0)
                  else lookup('ansible.builtin.file', item.source_path)
                )
              )
            })
        ]
      }}
  loop: "{{ litellm_configured_instruction_profiles }}"
  when: litellm_enabled | bool
  # - ansible.builtin.debug:
  #     var: litellm_effective_instruction_profiles

- name: Render LiteLLM config content facts
  ansible.builtin.set_fact:
    litellm_config_content: "{{ lookup('ansible.builtin.template', role_path + '/templates/config.yaml.j2') }}"
    litellm_custom_callbacks_content: "{{ lookup('ansible.builtin.template', role_path + '/templates/custom_callbacks.py.j2') }}"
    litellm_instruction_profiles_content: "{{ lookup('ansible.builtin.template', role_path + '/templates/instruction-profiles.yaml.j2') }}"
  when: litellm_enabled | bool
  # - ansible.builtin.debug:
  #     var: litellm_config_content

- name: Remove previous remote LiteLLM chart staging directory
  ansible.builtin.file:
    path: "{{ litellm_chart_remote_root }}"
    state: absent
  when: litellm_enabled | bool

- name: Create remote LiteLLM chart staging directory
  ansible.builtin.file:
    path: "{{ litellm_chart_remote_root }}"
    state: directory
    owner: "{{ ansible_user | default('root') }}"
    group: "{{ ansible_user | default('root') }}"
    mode: "0755"
  when: litellm_enabled | bool

- name: Copy LiteLLM Helm chart to remote host
  ansible.builtin.copy:
    src: "{{ litellm_chart_local_path }}/"
    dest: "{{ litellm_chart_remote_root }}/"
    owner: "{{ ansible_user | default('root') }}"
    group: "{{ ansible_user | default('root') }}"
    mode: "0644"
  when: litellm_enabled | bool

- name: Render LiteLLM Helm values
  ansible.builtin.template:
    src: values.yaml.j2
    dest: "{{ litellm_values_remote_path }}"
    owner: "{{ ansible_user | default('root') }}"
    group: "{{ ansible_user | default('root') }}"
    mode: "0600"
  no_log: true
  when: litellm_enabled | bool

- name: Deploy LiteLLM release
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - --install
      - "{{ litellm_release_name }}"
      - "{{ litellm_chart_remote_root }}"
      - --namespace
      - "{{ litellm_namespace }}"
      - --create-namespace
      - --values
      - "{{ litellm_values_remote_path }}"
      - --kubeconfig
      - /etc/rancher/k3s/k3s.yaml
  register: litellm_helm_deploy
  changed_when: "'deployed' in litellm_helm_deploy.stdout or 'upgraded' in litellm_helm_deploy.stdout"
  when:
    - litellm_enabled | bool
    - not litellm_helm_wait | bool
  # - ansible.builtin.debug:
  #     var: litellm_helm_deploy.stdout_lines

- name: Deploy LiteLLM release and wait
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - --install
      - "{{ litellm_release_name }}"
      - "{{ litellm_chart_remote_root }}"
      - --namespace
      - "{{ litellm_namespace }}"
      - --create-namespace
      - --values
      - "{{ litellm_values_remote_path }}"
      - --wait
      - --timeout
      - "{{ litellm_helm_timeout }}"
      - --kubeconfig
      - /etc/rancher/k3s/k3s.yaml
  register: litellm_helm_wait_deploy
  changed_when: "'deployed' in litellm_helm_wait_deploy.stdout or 'upgraded' in litellm_helm_wait_deploy.stdout"
  when:
    - litellm_enabled | bool
    - litellm_helm_wait | bool
  # - ansible.builtin.debug:
  #     var: litellm_helm_wait_deploy.stdout_lines

- name: Wait for current LiteLLM deployment rollout
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubectl
      - --kubeconfig
      - /etc/rancher/k3s/k3s.yaml
      - rollout
      - status
      - "deployment/{{ litellm_release_name }}"
      - --namespace
      - "{{ litellm_namespace }}"
      - "--timeout={{ litellm_helm_timeout }}"
  changed_when: false
  register: litellm_rollout_status
  when: litellm_enabled | bool
  # - ansible.builtin.debug:
  #     var: litellm_rollout_status.stdout_lines

- name: Show LiteLLM deployment summary
  ansible.builtin.debug:
    msg:
      - "LiteLLM release: {{ litellm_release_name }}"
      - "LiteLLM internal URL: {{ litellm_internal_base_url }}"
      - "LiteLLM Admin/API URL: http://{{ public_ip if (public_ip is defined and public_ip | default('', true) | length > 0) else (ansible_host | default(inventory_hostname)) }}:{{ litellm_node_port }}/ui/"
      - "Helm accepted the install or upgrade; run status_litellm.yml to check READY/NOT READY."
  when: litellm_enabled | bool
