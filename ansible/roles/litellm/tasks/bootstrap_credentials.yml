---
# The canonical per-instance file is generated by Terraform; it contains lab
# credentials and must never be displayed or passed as command-line values.
- name: Inspect the per-instance bootstrap credential file
  ansible.builtin.stat:
    path: "{{ lab_bootstrap_secrets_file }}"
    follow: false
  delegate_to: localhost
  become: false
  register: lab_bootstrap_credential_stat
  no_log: true
  # - ansible.builtin.debug:
  #     var: lab_bootstrap_credential_stat.stat.exists

- name: Require an owner-only regular bootstrap credential file
  ansible.builtin.assert:
    that:
      - lab_bootstrap_credential_stat.stat.exists | default(false)
      - lab_bootstrap_credential_stat.stat.isreg | default(false)
      - not (lab_bootstrap_credential_stat.stat.islnk | default(false))
      - lab_bootstrap_credential_stat.stat.mode == '0600'
    fail_msg: "The per-instance bootstrap credential file must be a regular owner-only file."
  no_log: true

- name: Read the per-instance bootstrap credentials on the controller
  ansible.builtin.slurp:
    src: "{{ lab_bootstrap_secrets_file }}"
  delegate_to: localhost
  become: false
  register: lab_bootstrap_credential_raw
  no_log: true
  # - ansible.builtin.debug:
  #     msg: "Bootstrap credential file was read."

- name: Require bootstrap credentials for the current instance
  ansible.builtin.assert:
    that:
      - k3s_instance_id | default('') | length > 0
      - (lab_bootstrap_credential_raw.content | b64decode | from_json).instance_id == k3s_instance_id
    fail_msg: "Bootstrap credentials do not belong to the current instance."
  no_log: true

- name: Apply per-instance LiteLLM credentials
  ansible.builtin.set_fact:
    litellm_master_key: "{{ (lab_bootstrap_credential_raw.content | b64decode | from_json).litellm.master_key }}"
    litellm_ui_password: "{{ (lab_bootstrap_credential_raw.content | b64decode | from_json).litellm.ui_password }}"
    litellm_postgres_password: "{{ (lab_bootstrap_credential_raw.content | b64decode | from_json).litellm.postgres_password }}"
  no_log: true
  # - ansible.builtin.debug:
  #     msg: "Per-instance LiteLLM credentials loaded."
