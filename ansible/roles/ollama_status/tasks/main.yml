---
- name: Skip Ollama status when disabled
  ansible.builtin.debug:
    msg: "ollama_enabled=false; skipping Ollama status."
  when: not ollama_enabled | bool

- name: Check Ollama deployment
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubectl
      - --kubeconfig
      - /etc/rancher/k3s/k3s.yaml
      - get
      - deployment
      - "{{ ollama_release_name }}"
      - -n
      - "{{ ollama_namespace }}"
      - -o
      - json
  changed_when: false
  failed_when: false
  register: ollama_status_deployment
  when: ollama_enabled | bool

- name: Check Ollama service
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubectl
      - --kubeconfig
      - /etc/rancher/k3s/k3s.yaml
      - get
      - service
      - "{{ ollama_release_name }}"
      - -n
      - "{{ ollama_namespace }}"
      - -o
      - json
  changed_when: false
  failed_when: false
  register: ollama_status_service
  when: ollama_enabled | bool

- name: Check Ollama pods
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubectl
      - --kubeconfig
      - /etc/rancher/k3s/k3s.yaml
      - get
      - pods
      - -n
      - "{{ ollama_namespace }}"
      - -l
      - "app.kubernetes.io/instance={{ ollama_release_name }}"
      - --no-headers
  changed_when: false
  failed_when: false
  register: ollama_status_pod_table
  when: ollama_enabled | bool

- name: Check Ollama model pull job
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubectl
      - --kubeconfig
      - /etc/rancher/k3s/k3s.yaml
      - get
      - job
      - "{{ ollama_model_pull_job_name }}"
      - -n
      - "{{ ollama_namespace }}"
      - -o
      - json
  changed_when: false
  failed_when: false
  register: ollama_status_model_pull_job
  when: ollama_enabled | bool

- name: List Ollama models
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubectl
      - --kubeconfig
      - /etc/rancher/k3s/k3s.yaml
      - exec
      - "deployment/{{ ollama_release_name }}"
      - -n
      - "{{ ollama_namespace }}"
      - --
      - /bin/sh
      - -c
      - "ollama list | awk 'NR > 1 { print $1 }'"
  changed_when: false
  failed_when: false
  register: ollama_status_model_list
  when: ollama_enabled | bool

- name: Set Ollama status facts
  ansible.builtin.set_fact:
    ollama_status_deployment_json: "{{ ollama_status_deployment.stdout | default('{}') | from_json if ollama_status_deployment.rc == 0 else {} }}"
    ollama_status_model_pull_job_json: "{{ ollama_status_model_pull_job.stdout | default('{}') | from_json if ollama_status_model_pull_job.rc == 0 else {} }}"
    ollama_status_pod_lines: "{{ ollama_status_pod_table.stdout_lines | default([]) }}"
    ollama_status_model_names: "{{ ollama_status_model_list.stdout_lines | default([]) }}"
  when: ollama_enabled | bool

- name: Set Ollama status summary facts
  ansible.builtin.set_fact:
    ollama_status_missing_models: "{{ ollama_models | difference(ollama_status_model_names) }}"
    ollama_status_ready: >-
      {{
        ollama_status_deployment.rc == 0
        and ollama_status_service.rc == 0
        and (ollama_status_deployment_json.status.availableReplicas | default(0) | int) >= 1
        and (ollama_status_model_pull_job_json.status.succeeded | default(0) | int) >= 1
        and (ollama_models | difference(ollama_status_model_names) | length) == 0
      }}
    ollama_status_problems: >-
      {{
        []
        + (['Deployment missing'] if ollama_status_deployment.rc != 0 else [])
        + (['Service missing'] if ollama_status_service.rc != 0 else [])
        + (['Available replicas ' ~ (ollama_status_deployment_json.status.availableReplicas | default(0) | string) ~ '/1'] if ollama_status_deployment.rc == 0 and (ollama_status_deployment_json.status.availableReplicas | default(0) | int) < 1 else [])
        + (['Model pull job not complete'] if ollama_status_model_pull_job.rc != 0 or (ollama_status_model_pull_job_json.status.succeeded | default(0) | int) < 1 else [])
        + (['Missing models: ' ~ ((ollama_models | difference(ollama_status_model_names)) | join(', '))] if (ollama_models | difference(ollama_status_model_names) | length) > 0 else [])
      }}
  when: ollama_enabled | bool

- name: Show Ollama status summary
  ansible.builtin.debug:
    msg:
      - "Ollama status: {{ 'READY' if ollama_status_ready else 'NOT READY' }}"
      - "Pods (NAME READY STATUS RESTARTS AGE): {{ ollama_status_pod_lines | join('; ') if ollama_status_pod_lines | length > 0 else 'none' }}"
      - "Configured models: {{ ollama_models | join(', ') }}"
      - "Loaded models: {{ ollama_status_model_names | join(', ') if ollama_status_model_names | length > 0 else 'none' }}"
      - "Problems: {{ ollama_status_problems | join(' | ') if ollama_status_problems | length > 0 else 'none' }}"
  when: ollama_enabled | bool

- name: Fail when Ollama is not ready
  ansible.builtin.fail:
    msg: "Ollama validation did not pass: {{ ollama_status_problems | join(' | ') }}"
  when:
    - ollama_enabled | bool
    - ollama_status_fail_on_not_ready | bool
    - not ollama_status_ready
