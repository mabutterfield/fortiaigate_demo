---
validate_k3s_kubeconfig: /etc/rancher/k3s/k3s.yaml
validate_k3s_wait_timeout: 180s
validate_k3s_pod_wait_retries: 1
validate_k3s_pod_wait_delay: 0
validate_k3s_pod_health_namespaces:
  - kube-system
  - ingress-nginx
validate_k3s_dns_check_image: busybox:1.36
validate_k3s_dns_check_pod: validate-k3s-dns
validate_k3s_internal_dns_name: kubernetes.default.svc.cluster.local
validate_k3s_external_dns_name: example.com

# Public test image; pin/version compatibility must be validated on the chosen host.
validate_k3s_gpu_check_image: nvidia/cuda:12.8.1-base-ubuntu24.04
validate_k3s_workload_timeout: 300s
