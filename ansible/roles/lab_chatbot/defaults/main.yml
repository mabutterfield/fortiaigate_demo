---
# FortiAIGate 8.0.2 student lab chatbot (chatbot/lab-chatbot/chart).
# Cluster-internal Streamlit app reached only through the lab login gateway
# (demo_https_gateway with lab_gateway_enabled). See docs/lab-chatbot.md.
lab_chatbot_enabled: true
lab_chatbot_namespace: lab-chatbot
lab_chatbot_release_name: lab-chatbot
lab_chatbot_service_port: 80
lab_chatbot_title: FortiAIGate Lab Chatbot
lab_chatbot_chart_local_path: "{{ (playbook_dir + '/../../chatbot/lab-chatbot/chart') | realpath }}"
lab_chatbot_agent_local_path: "{{ (playbook_dir + '/../../chatbot/agent/faig_agent.py') | realpath }}"
# Change 2026-11-20: contains_sensitive moved to catalog802/sensitive.py; result_contract.py is no longer shipped.
# lab_chatbot_result_contract_local_path: "{{ (playbook_dir + '/../../functional_test/result_contract.py') | realpath }}"
lab_chatbot_repo_root: "{{ (playbook_dir + '/../..') | realpath }}"
# Change 2026-11-19: catalog view and evaluator package (replace scenario-pack.json).
lab_chatbot_catalog_python: python3
lab_chatbot_catalog_package_files:
  - __init__.py
  - loader.py
  - vocabulary.py
  - result_contract.py
  - sensitive.py  # Change 2026-11-20
lab_chatbot_chart_remote_root: "/home/{{ ansible_user }}/tmp/lab-chatbot-chart"
lab_chatbot_values_remote_path: "/home/{{ ansible_user }}/tmp/lab-chatbot-values.yaml"
lab_chatbot_image_repository: python
lab_chatbot_image_tag: "3.12-slim"
lab_chatbot_rollout_timeout: 420s

# Student key files from experiments/faig-api-lab/scenario_lab.py
# (<dir>/studentNN-keys/*.json, owner-only). Each student directory seeds one
# Secret <prefix><student>; existing Secrets are kept because students may
# have replaced keys in the chatbot. Set lab_chatbot_reseed_keys: true to
# overwrite them from the files (this discards student edits).
lab_chatbot_student_credentials_dir: "{{ (faig_env_dir ~ '/students') if faig_env_dir | default('') | length > 0 else (faig_workspace_root ~ '/.student-credentials') }}"
lab_chatbot_key_secret_prefix: lab-keys-
lab_chatbot_reseed_keys: false
# Read-only instructor copy per student (<seed prefix><student>), rewritten on
# every deploy; the Admin tab compares and restores keys from it.
lab_chatbot_seed_secret_prefix: lab-seed-

# In-cluster endpoints.
# Change 2026-11-20: HTTPS (FAIG's ingress forces it). The self-signed lab certificate does not name
# this in-cluster address, so verification is off unless a matching certificate is installed.
lab_chatbot_faig_url: "https://ingress-nginx-controller.ingress-nginx.svc.cluster.local/ai/openai/v1"
lab_chatbot_faig_verify_tls: false
lab_chatbot_direct_url: "http://{{ litellm_release_name | default('litellm') }}.{{ litellm_namespace | default('litellm') }}.svc.cluster.local:{{ litellm_service_port | default(4000) }}/v1"
lab_chatbot_mcp_url: "{{ mcp_standard_internal_base_url | default('http://mcp-demo.mcp.svc.cluster.local:8001/mcp') }}"
lab_chatbot_auth_url: "http://{{ demo_https_gateway_release_name | default('demo-https-gateway') }}-auth.{{ demo_https_gateway_namespace | default('demo-https-gateway') }}.svc.cluster.local:{{ lab_gateway_auth_port | default(8090) }}"
lab_chatbot_max_tokens: 2048
lab_chatbot_temperature: "0.0"
# Change 2026-11-20: GUI-only install (no GPU, no license, inspection off). Set by the
# deployment as faig_gui_only; tests are shown but not graded.
lab_chatbot_gui_only: "{{ faig_gui_only | default(false) }}"

# Secrets copied into the chatbot namespace on every deploy.
lab_chatbot_signing_source_namespace: "{{ demo_https_gateway_namespace | default('demo-https-gateway') }}"
lab_chatbot_signing_source_secret: "{{ lab_gateway_signing_secret_name | default('lab-gateway-signing') }}"
lab_chatbot_signing_secret_name: lab-chatbot-signing
lab_chatbot_direct_source_namespace: "{{ litellm_namespace | default('litellm') }}"
lab_chatbot_direct_source_secret: "{{ litellm_shared_virtual_key_secret_name | default('litellm-shared-virtual-key') }}"
lab_chatbot_direct_secret_name: lab-chatbot-direct
# Change 2026-11-19: broker caller token (gateway Secret lab-gateway-callers,
# key lab-chatbot) for the student key endpoints; optional until used.
lab_chatbot_caller_source_secret: "{{ lab_gateway_caller_secret_name | default('lab-gateway-callers') }}"
lab_chatbot_caller_secret_name: lab-chatbot-caller
# Change 2026-11-20: fail the deploy when the gateway has no lab-chatbot caller
# token (deploy the gateway first). Set false to deploy without the Keys tab.
lab_chatbot_require_caller_token: true
