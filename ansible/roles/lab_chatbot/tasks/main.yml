- name: Remove previous remote lab chatbot chart staging directory
  ansible.builtin.file:
    path: "{{ lab_chatbot_chart_remote_root }}"
    state: absent
  when: lab_chatbot_enabled | bool

- name: Create remote lab chatbot chart staging directory
  ansible.builtin.file:
    path: "{{ lab_chatbot_chart_remote_root }}"
    state: directory
    owner: "{{ ansible_user | default('root') }}"
    group: "{{ ansible_user | default('root') }}"
    mode: "0755"
  when: lab_chatbot_enabled | bool

- name: Copy lab chatbot Helm chart to remote host
  ansible.builtin.copy:
    src: "{{ lab_chatbot_chart_local_path }}/"
    dest: "{{ lab_chatbot_chart_remote_root }}/"
    owner: "{{ ansible_user | default('root') }}"
    group: "{{ ansible_user | default('root') }}"
    mode: "0644"
  when: lab_chatbot_enabled | bool

- name: Copy shared agent and result contract into the remote chart files
  # Change 2026-11-19: scenario-pack.json is no longer copied (catalog view below).
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ lab_chatbot_chart_remote_root }}/files/"
    owner: "{{ ansible_user | default('root') }}"
    group: "{{ ansible_user | default('root') }}"
    mode: "0644"
  loop:
    - "{{ lab_chatbot_agent_local_path }}"
    - "{{ lab_chatbot_result_contract_local_path }}"
  when: lab_chatbot_enabled | bool

- name: Copy the catalog view into the remote chart
  ansible.builtin.copy:
    src: "{{ lab_chatbot_local_stage.path }}/catalog-student.json"
    dest: "{{ lab_chatbot_chart_remote_root }}/catalog/"
    owner: "{{ ansible_user | default('root') }}"
    group: "{{ ansible_user | default('root') }}"
    mode: "0644"
  when: lab_chatbot_enabled | bool

- name: Create the evaluator package directory in the remote chart
  ansible.builtin.file:
    path: "{{ lab_chatbot_chart_remote_root }}/pylib/catalog802"
    state: directory
    owner: "{{ ansible_user | default('root') }}"
    group: "{{ ansible_user | default('root') }}"
    mode: "0755"
  when: lab_chatbot_enabled | bool

- name: Copy the catalog evaluator package (catalog802) into the remote chart
  ansible.builtin.copy:
    src: "{{ lab_chatbot_repo_root }}/catalog802/{{ item }}"
    dest: "{{ lab_chatbot_chart_remote_root }}/pylib/catalog802/{{ item }}"
    owner: "{{ ansible_user | default('root') }}"
    group: "{{ ansible_user | default('root') }}"
    mode: "0644"
  loop: "{{ lab_chatbot_catalog_package_files }}"
  when: lab_chatbot_enabled | bool

- name: Remove controller catalog staging directory
  ansible.builtin.file:
    path: "{{ lab_chatbot_local_stage.path }}"
    state: absent
  delegate_to: localhost
  become: false
  when: lab_chatbot_enabled | bool

- name: Render lab chatbot Helm values
  ansible.builtin.template:
    src: values.yaml.j2
    dest: "{{ lab_chatbot_values_remote_path }}"
    owner: "{{ ansible_user | default('root') }}"
    group: "{{ ansible_user | default('root') }}"
    mode: "0600"
  when: lab_chatbot_enabled | bool

- name: Ensure lab chatbot namespace exists
  ansible.builtin.shell: |
    /usr/local/bin/kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml get namespace {{ lab_chatbot_namespace }} >/dev/null 2>&1 \
      || /usr/local/bin/kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml create namespace {{ lab_chatbot_namespace }}
  changed_when: false
  when: lab_chatbot_enabled | bool

- name: Copy gateway signing key and shared LiteLLM key into the chatbot namespace
  # Secret data is piped between kubectl calls on the host and never printed.
  ansible.builtin.shell: |
    set -euo pipefail
    K="/usr/local/bin/kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml"
    $K -n {{ item.source_namespace }} get secret {{ item.source_secret }} -o json \
      | python3 -c 'import json, sys; s = json.load(sys.stdin); print(json.dumps({"apiVersion": "v1", "kind": "Secret", "type": "Opaque", "metadata": {"name": sys.argv[1], "namespace": sys.argv[2], "labels": {"app.kubernetes.io/part-of": "lab-chatbot"}}, "data": s["data"]}))' \
        {{ item.target_secret }} {{ lab_chatbot_namespace }} \
      | $K apply -f - >/dev/null
  args:
    executable: /bin/bash
  loop:
    - source_namespace: "{{ lab_chatbot_signing_source_namespace }}"
      source_secret: "{{ lab_chatbot_signing_source_secret }}"
      target_secret: "{{ lab_chatbot_signing_secret_name }}"
    - source_namespace: "{{ lab_chatbot_direct_source_namespace }}"
      source_secret: "{{ lab_chatbot_direct_source_secret }}"
      target_secret: "{{ lab_chatbot_direct_secret_name }}"
  loop_control:
    label: "{{ item.target_secret }}"
  changed_when: false
  no_log: true
  when: lab_chatbot_enabled | bool

- name: Copy the broker caller token into the chatbot namespace
  # Change 2026-11-19: piped between kubectl calls on the host, never printed.
  ansible.builtin.shell: |
    set -euo pipefail
    K="/usr/local/bin/kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml"
    SRC_NS="{{ lab_chatbot_signing_source_namespace }}"
    if ! $K -n "$SRC_NS" get secret {{ lab_chatbot_caller_source_secret }} >/dev/null 2>&1; then echo missing; exit 0; fi
    DOC="$($K -n "$SRC_NS" get secret {{ lab_chatbot_caller_source_secret }} -o json \
      | python3 -c 'import json, sys; s = json.load(sys.stdin); v = (s.get("data") or {}).get("lab-chatbot"); print(json.dumps({"apiVersion": "v1", "kind": "Secret", "type": "Opaque", "metadata": {"name": sys.argv[1], "namespace": sys.argv[2], "labels": {"app.kubernetes.io/part-of": "lab-chatbot"}}, "data": {"token": v}}) if v else "")' \
        {{ lab_chatbot_caller_secret_name }} {{ lab_chatbot_namespace }})"
    if [ -n "$DOC" ]; then printf '%s' "$DOC" | $K apply -f - >/dev/null; echo copied; else echo missing; fi
  args:
    executable: /bin/bash
  register: lab_chatbot_caller_copy
  changed_when: false
  no_log: true
  when: lab_chatbot_enabled | bool
  # - ansible.builtin.debug:
  #     var: lab_chatbot_caller_copy.stdout

# Change 2026-11-20: a missing caller token used to pass silently and the Keys tab
# then showed "key service not configured".
- name: Require the broker caller token
  ansible.builtin.fail:
    msg: >-
      Secret {{ lab_chatbot_caller_source_secret }} (key lab-chatbot) was not found in
      namespace {{ lab_chatbot_signing_source_namespace }}. Deploy the lab gateway
      (deploy_demo_https_gateway.yml) before the chatbot, or set
      lab_chatbot_require_caller_token=false to deploy without student key endpoints.
  when:
    - lab_chatbot_enabled | bool
    - lab_chatbot_require_caller_token | bool
    - lab_chatbot_caller_copy.stdout | default('') | trim == 'missing'

- name: Warn that the broker caller token is missing
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ lab_chatbot_caller_source_secret }} not found; the chatbot Keys tab
      will show "key service not configured" until the gateway is deployed and the
      chatbot is redeployed.
  when:
    - lab_chatbot_enabled | bool
    - not (lab_chatbot_require_caller_token | bool)
    - lab_chatbot_caller_copy.stdout | default('') | trim == 'missing'

