- name: Deploy lab chatbot release
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - --install
      - "{{ lab_chatbot_release_name }}"
      - "{{ lab_chatbot_chart_remote_root }}"
      - --namespace
      - "{{ lab_chatbot_namespace }}"
      - --create-namespace
      - --values
      - "{{ lab_chatbot_values_remote_path }}"
      - --kubeconfig
      - /etc/rancher/k3s/k3s.yaml
  register: lab_chatbot_helm_deploy
  changed_when: "'deployed' in lab_chatbot_helm_deploy.stdout or 'upgraded' in lab_chatbot_helm_deploy.stdout"
  when: lab_chatbot_enabled | bool
  # - ansible.builtin.debug:
  #     var: lab_chatbot_helm_deploy.stdout_lines

- name: Wait for lab chatbot rollout (dependencies install at pod start)
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubectl
      - --kubeconfig
      - /etc/rancher/k3s/k3s.yaml
      - -n
      - "{{ lab_chatbot_namespace }}"
      - rollout
      - status
      - "deployment/{{ lab_chatbot_release_name }}"
      - "--timeout={{ lab_chatbot_rollout_timeout }}"
  changed_when: false
  when: lab_chatbot_enabled | bool

- name: Check lab chatbot health inside the cluster
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubectl
      - --kubeconfig
      - /etc/rancher/k3s/k3s.yaml
      - -n
      - "{{ lab_chatbot_namespace }}"
      - exec
      - "deployment/{{ lab_chatbot_release_name }}"
      - --
      - python
      - -c
      - "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=10).read().decode())"
  register: lab_chatbot_health
  changed_when: false
  when: lab_chatbot_enabled | bool

- name: Show lab chatbot status
  ansible.builtin.debug:
    msg:
      - "Lab chatbot health: {{ lab_chatbot_health.stdout | default('') }}"
      - "Scenarios come from the catalog view; keys come from the gateway (lab-data/lab-keys)."
      - "Users reach it through the lab login gateway (chatbot route)."
  when: lab_chatbot_enabled | bool
