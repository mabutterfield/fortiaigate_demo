- name: Validate lab chatbot settings
  # Change 2026-11-19: student key directories are no longer required; the app
  # starts with zero students and reads keys through the gateway.
  ansible.builtin.assert:
    that:
      - lab_chatbot_chart_local_path is directory
      - lab_chatbot_agent_local_path is file
      - lab_chatbot_result_contract_local_path is file
      - (lab_chatbot_repo_root ~ '/catalog802') is directory
    fail_msg: >-
      The lab chatbot needs the chart, chatbot/agent/faig_agent.py, functional_test/result_contract.py
      and the catalog802 package. The lab login gateway must be deployed first (its signing Secret and
      caller token are copied below).
  when: lab_chatbot_enabled | bool

- name: Create controller staging directory for the catalog view
  ansible.builtin.tempfile:
    state: directory
    suffix: lab-chatbot
  delegate_to: localhost
  become: false
  register: lab_chatbot_local_stage
  when: lab_chatbot_enabled | bool

- name: Render the secret-free catalog student view on the controller
  # Change 2026-11-19: replaces the scenario pack.
  ansible.builtin.command:
    argv:
      - "{{ lab_chatbot_catalog_python }}"
      - -m
      - catalog802
      - student
    chdir: "{{ lab_chatbot_repo_root }}"
  delegate_to: localhost
  become: false
  changed_when: false
  register: lab_chatbot_catalog_render
  when: lab_chatbot_enabled | bool
  # - ansible.builtin.debug:
  #     msg: "{{ lab_chatbot_catalog_render.stdout | length }} bytes"

- name: Write the catalog view to the controller staging directory
  ansible.builtin.copy:
    content: "{{ lab_chatbot_catalog_render.stdout }}\n"
    dest: "{{ lab_chatbot_local_stage.path }}/catalog-student.json"
    mode: "0644"
  delegate_to: localhost
  become: false
  when: lab_chatbot_enabled | bool

