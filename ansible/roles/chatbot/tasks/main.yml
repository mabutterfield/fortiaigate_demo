---
- name: Skip chatbot deployment when disabled
  ansible.builtin.debug:
    msg: "chatbots_enabled=false; skipping chatbot deployment."
  when: not chatbots_enabled | bool

- name: Build installed scenario matrix for chatbot
  ansible.builtin.command:
    argv: >-
      {{
        [ansible_playbook_python, scenario_matrix_builder_path]
        + (
          ['--debug-all-server-tools']
          if chatbot_mcp_show_debug_all_server_tools | bool
          else []
        )
        + (
          ['--fortiweb-mcp-desired']
          if fortiweb_mcp_proxy_enabled | default(false) | bool
          else []
        )
        + (
          ['--fortiweb-installed']
          if fortiweb_public_private_ip | default('') | string | length > 0
          else []
        )
        + (
          ['--fortiweb-mcp-base-url', fortiweb_mcp_http_base_url]
          if fortiweb_mcp_http_base_url | default('') | string | length > 0
          else []
        )
        + (
          ['--fortigate-routes-desired']
          if chatbot_fortigate_routes_desired | bool
          else []
        )
      }}
  changed_when: false
  check_mode: false
  register: chatbot_scenario_matrix_result
  delegate_to: localhost
  become: false
  when:
    - chatbots_enabled | bool
    - demo_configuration_source == 'scenario_matrix'
  # - ansible.builtin.debug:
  #     var: chatbot_scenario_matrix_result.stdout_lines

- name: Set chatbot scenario matrix fact
  ansible.builtin.set_fact:
    chatbot_scenario_matrix: "{{ chatbot_scenario_matrix_result.stdout | from_json }}"
  when:
    - chatbots_enabled | bool
    - demo_configuration_source == 'scenario_matrix'
  # - ansible.builtin.debug:
  #     var: chatbot_scenario_matrix

- name: Reset effective chatbot frontend instruction profiles
  ansible.builtin.set_fact:
    chatbot_frontend_instruction_profiles: []
  when:
    - chatbots_enabled | bool
    - demo_configuration_source == 'scenario_matrix'
  # - ansible.builtin.debug:
  #     var: chatbot_frontend_instruction_profiles

- name: Resolve chatbot frontend instruction profile content
  ansible.builtin.set_fact:
    chatbot_frontend_instruction_profiles: >-
      {{
        chatbot_frontend_instruction_profiles
        + [
          {
            'id': item.id,
            'label': item.display_name,
            'source_type': item.source_type,
            'scenario_id': item.scenario_id | default(''),
            'instruction': (
              lookup(
                'ansible.builtin.file',
                item.source_path
                if (item.source_path | default('') | regex_search('^/'))
                else scenario_matrix_repo_root ~ '/' ~ item.source_path
              )
              if item.source_type == 'file'
              else ''
            )
          }
        ]
      }}
  loop: "{{ chatbot_scenario_matrix.chatbot_frontend_instruction_profiles }}"
  loop_control:
    label: "{{ item.id }}"
  when:
    - chatbots_enabled | bool
    - demo_configuration_source == 'scenario_matrix'
  # - ansible.builtin.debug:
  #     var: chatbot_frontend_instruction_profiles

- name: Set matrix-driven chatbot configuration facts
  ansible.builtin.set_fact:
    chatbot_model: "{{ chatbot_scenario_matrix.chatbot_advanced_controls.default_model }}"
    chatbot_model_options: "{{ chatbot_scenario_matrix.chatbot_model_options }}"
    chatbot_model_options_effective: "{{ chatbot_scenario_matrix.chatbot_model_options }}"
    chatbot_faig_static_route: "{{ chatbot_scenario_matrix.chatbot_advanced_controls.default_faig_route }}"
    chatbot_faig_static_routes: "{{ chatbot_scenario_matrix.chatbot_faig_static_routes }}"
    chatbot_faig_static_routes_effective: "{{ chatbot_scenario_matrix.chatbot_faig_static_routes }}"
    chatbot_faig_header_route: ""
    chatbot_faig_header_routes: []
    chatbot_fortigate_litellm_base_url: ""
    chatbot_fortigate_ollama_base_url: ""
    chatbot_mcp_default_path: "{{ chatbot_scenario_matrix.chatbot_advanced_controls.default_mcp_path }}"
    chatbot_mcp_fortiweb_base_url: >-
      {{
        chatbot_scenario_matrix.chatbot_mcp_paths
        | selectattr('name', 'equalto', 'fortiweb')
        | map(attribute='base_url')
        | first
        | default('', true)
      }}
    chatbot_mcp_tool_profile: "{{ chatbot_scenario_matrix.chatbot_advanced_controls.default_mcp_tool_profile }}"
    chatbot_mcp_tool_profile_effective: "{{ chatbot_scenario_matrix.chatbot_advanced_controls.default_mcp_tool_profile }}"
    chatbot_mcp_tool_profiles: "{{ chatbot_scenario_matrix.chatbot_mcp_tool_profiles }}"
    chatbot_mcp_tool_profiles_effective: "{{ chatbot_scenario_matrix.chatbot_mcp_tool_profiles }}"
    chatbot_mcp_enabled: "{{ chatbot_scenario_matrix.chatbot_mcp_tool_profiles | length > 0 }}"
    chatbot_simplified_profiles: "{{ chatbot_scenario_matrix.chatbot_simplified_profiles }}"
    chatbot_simplified_profiles_effective: "{{ chatbot_scenario_matrix.chatbot_simplified_profiles }}"
    chatbot_frontend_system_prompt: ""
    chatbot_frontend_system_prompt_source_path: ""
    chatbot_frontend_system_prompt_enabled: false
    chatbot_frontend_instruction_profile: none
    chatbot_context_summary_model: "{{ chatbot_scenario_matrix.global.passthrough_model_alias }}"
    chatbot_ui_mode: simplified
  when:
    - chatbots_enabled | bool
    - demo_configuration_source == 'scenario_matrix'
  # - ansible.builtin.debug:
  #     msg:
  #       models: "{{ chatbot_model_options_effective }}"
  #       routes: "{{ chatbot_faig_static_routes_effective }}"
  #       simplified_profiles: "{{ chatbot_simplified_profiles_effective | map(attribute='id') | list }}"

- name: Validate matrix-driven chatbot contract
  ansible.builtin.assert:
    that:
      - chatbot_scenario_matrix.global.passthrough_model_alias in chatbot_model_options_effective
      - chatbot_faig_static_routes_effective | selectattr('name', 'equalto', 'passthrough') | list | length == 1
      - >-
        chatbot_model_options_effective
        | select('match', '^demo-[a-z](?:-|$)')
        | list
        | length == 0
    fail_msg: "Scenario matrix chatbot output must include canonical passthrough and cannot generate demo-letter options."
  when:
    - chatbots_enabled | bool
    - demo_configuration_source == 'scenario_matrix'

- name: Validate chatbot instance definitions
  ansible.builtin.assert:
    that:
      - chatbot_instances is sequence
      - chatbot_instances | length > 0
      - item.name is defined
      - item.name | default('', true) | length > 0
      - item.namespace is defined
      - item.namespace | default('', true) | length > 0
      - item.release_name is defined
      - item.release_name | default('', true) | length > 0
      - item.direct_base_url is defined
      - item.direct_base_url | default('', true) | length > 0
      - item.faig_base_url is defined
      - item.faig_base_url | default('', true) | length > 0
      - item.node_port is defined
      - item.node_port | int >= 30000
      - item.node_port | int <= 32767
    fail_msg: "Each chatbot instance needs name, namespace, release_name, direct_base_url, faig_base_url, and a NodePort between 30000 and 32767."
  loop: "{{ chatbot_instances }}"
  no_log: true
  when: chatbots_enabled | bool

- name: Ensure local chatbot instruction profile directories exist
  ansible.builtin.file:
    path: "{{ item.value.local_path | dirname }}"
    state: directory
    mode: "0755"
  loop: "{{ chatbot_instruction_profile_files | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  delegate_to: localhost
  become: false
  when:
    - chatbots_enabled | bool
    - demo_configuration_source == 'legacy'
    - item.value.example_path is file

- name: Initialize local chatbot instruction profile files from examples
  ansible.builtin.copy:
    src: "{{ item.value.example_path }}"
    dest: "{{ item.value.local_path }}"
    mode: "0644"
    force: false
  loop: "{{ chatbot_instruction_profile_files | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  delegate_to: localhost
  become: false
  when:
    - chatbots_enabled | bool
    - demo_configuration_source == 'legacy'
    - item.value.example_path is file
  # - ansible.builtin.debug:
  #     msg: "Initialized local chatbot instruction profile {{ item.key }} at {{ item.value.local_path }}"

- name: Install Helm when missing
  ansible.builtin.shell: |
    set -euo pipefail
    if ! command -v helm >/dev/null 2>&1; then
      curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
    fi
  args:
    executable: /bin/bash
    creates: /usr/local/bin/helm
  when: chatbots_enabled | bool

- name: Set chatbot namespace facts
  ansible.builtin.set_fact:
    chatbot_namespaces: "{{ chatbot_instances | map(attribute='namespace') | list | unique }}"
  when: chatbots_enabled | bool
  # - ansible.builtin.debug:
  #     var: chatbot_namespaces

- name: Validate chatbot ECR pull secret settings
  ansible.builtin.assert:
    that:
      - chatbot_ecr_token_source in ['instance_role', 'controller_profile']
      - aws_region is defined
      - aws_region | default('', true) | length > 0
      - ecr_registry is defined
      - ecr_registry | default('', true) | length > 0
      - ecr_pull_secret_name is defined
      - ecr_pull_secret_name | default('', true) | length > 0
    fail_msg: "Chatbot ECR image pulls require aws_region, ecr_registry, ecr_pull_secret_name, and chatbot_ecr_token_source as instance_role or controller_profile."
  when:
    - chatbots_enabled | bool
    - chatbot_image_pull_secrets | default([], true) | length > 0

- name: Create chatbot namespaces
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubectl
      - --kubeconfig
      - /etc/rancher/k3s/k3s.yaml
      - create
      - namespace
      - "{{ item }}"
  loop: "{{ chatbot_namespaces }}"
  register: chatbot_namespace_create
  changed_when: "'created' in chatbot_namespace_create.stdout"
  failed_when:
    - chatbot_namespace_create.rc != 0
    - "'AlreadyExists' not in chatbot_namespace_create.stderr"
  when: chatbots_enabled | bool
  # - ansible.builtin.debug:
  #     var: chatbot_namespace_create.results

- name: Get chatbot ECR pull token from EC2 instance role
  ansible.builtin.shell: |
    set -euo pipefail
    /usr/local/bin/aws ecr get-login-password --region {{ aws_region | quote }}
  args:
    executable: /bin/bash
  no_log: true
  register: chatbot_ecr_instance_role_pull_token
  changed_when: false
  failed_when: false
  when:
    - chatbots_enabled | bool
    - chatbot_image_pull_secrets | default([], true) | length > 0
    - chatbot_ecr_token_source == "instance_role"
  # - ansible.builtin.debug:
  #     var: chatbot_ecr_instance_role_pull_token.rc

- name: Get chatbot ECR pull token from controller AWS profile
  ansible.builtin.shell: |
    set -euo pipefail
    aws ecr get-login-password --profile {{ aws_profile | quote }} --region {{ aws_region | quote }}
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  no_log: true
  register: chatbot_ecr_controller_profile_pull_token
  changed_when: false
  failed_when: false
  when:
    - chatbots_enabled | bool
    - chatbot_image_pull_secrets | default([], true) | length > 0
    - chatbot_ecr_token_source == "controller_profile"
  # - ansible.builtin.debug:
  #     var: chatbot_ecr_controller_profile_pull_token.rc

- name: Set effective chatbot ECR pull token result
  ansible.builtin.set_fact:
    chatbot_ecr_pull_token_result: >-
      {{
        chatbot_ecr_instance_role_pull_token
        if chatbot_ecr_token_source == 'instance_role'
        else chatbot_ecr_controller_profile_pull_token
      }}
  no_log: true
  when:
    - chatbots_enabled | bool
    - chatbot_image_pull_secrets | default([], true) | length > 0
  # - ansible.builtin.debug:
  #     var: chatbot_ecr_pull_token_result.rc

- name: Build chatbot MCP tool profiles from installed scenarios
  ansible.builtin.command:
    argv: "{{ ['python3', playbook_dir ~ '/../../scripts/build_chatbot_mcp_profiles.py', '--slots'] + (chatbot_mcp_installed_tool_profile_slots | default(['demo-a', 'demo-b'], true) | list) + (['--include-debug-all-server-tools'] if chatbot_mcp_show_debug_all_server_tools | default(false) | bool else []) }}"
  delegate_to: localhost
  become: false
  changed_when: false
  register: chatbot_mcp_installed_tool_profiles_raw
  when:
    - chatbots_enabled | bool
    - chatbot_mcp_tool_profiles_source | default('installed') == 'installed'
  tags: [chatbot, chatbot_mcp_profiles]
  # - ansible.builtin.debug:
  #     var: chatbot_mcp_installed_tool_profiles_raw.stdout

- name: Set effective chatbot MCP tool profile facts
  ansible.builtin.set_fact:
    chatbot_mcp_installed_tool_profiles_data: "{{ chatbot_mcp_installed_tool_profiles_raw.stdout | from_json }}"
    chatbot_mcp_tool_profiles_effective: "{{ (chatbot_mcp_installed_tool_profiles_raw.stdout | from_json).profiles }}"
    chatbot_mcp_tool_profile_effective: "{{ (chatbot_mcp_installed_tool_profiles_raw.stdout | from_json).default_profile }}"
  when:
    - chatbots_enabled | bool
    - chatbot_mcp_tool_profiles_source | default('installed') == 'installed'
  tags: [chatbot, chatbot_mcp_profiles]
  # - ansible.builtin.debug:
  #     var: chatbot_mcp_tool_profiles_effective

- name: Use configured chatbot MCP tool profiles
  ansible.builtin.set_fact:
    chatbot_mcp_tool_profiles_effective: "{{ chatbot_mcp_tool_profiles }}"
    chatbot_mcp_tool_profile_effective: "{{ chatbot_mcp_tool_profile }}"
  when:
    - chatbots_enabled | bool
    - chatbot_mcp_tool_profiles_source | default('installed') == 'configured'
  tags: [chatbot, chatbot_mcp_profiles]
  # - ansible.builtin.debug:
  #     var: chatbot_mcp_tool_profiles_effective

- name: Build simplified chatbot demo profiles from installed scenarios
  ansible.builtin.command:
    argv: "{{ ['python3', playbook_dir ~ '/../../scripts/build_chatbot_demo_profiles.py', '--slots'] + (chatbot_simplified_profile_slots | default(['demo-a', 'demo-b', 'frontend'], true) | list) }}"
  delegate_to: localhost
  become: false
  changed_when: false
  register: chatbot_simplified_installed_profiles_raw
  when:
    - chatbots_enabled | bool
    - chatbot_simplified_profiles_source | default('installed') == 'installed'
  tags: [chatbot, chatbot_simplified_profiles]
  # - ansible.builtin.debug:
  #     var: chatbot_simplified_installed_profiles_raw.stdout

- name: Set effective simplified chatbot demo profile facts
  ansible.builtin.set_fact:
    chatbot_simplified_installed_profiles_data: "{{ chatbot_simplified_installed_profiles_raw.stdout | from_json }}"
    chatbot_simplified_profiles_effective: "{{ (chatbot_simplified_installed_profiles_raw.stdout | from_json).profiles }}"
  when:
    - chatbots_enabled | bool
    - chatbot_simplified_profiles_source | default('installed') == 'installed'
  tags: [chatbot, chatbot_simplified_profiles]
  # - ansible.builtin.debug:
  #     var: chatbot_simplified_profiles_effective

- name: Use configured simplified chatbot demo profiles
  ansible.builtin.set_fact:
    chatbot_simplified_profiles_effective: "{{ chatbot_simplified_profiles }}"
  when:
    - chatbots_enabled | bool
    - chatbot_simplified_profiles_source | default('installed') == 'configured'
  tags: [chatbot, chatbot_simplified_profiles]
  # - ansible.builtin.debug:
  #     var: chatbot_simplified_profiles_effective

- name: Fail when chatbot ECR pull token retrieval failed
  ansible.builtin.fail:
    msg: >-
      Could not get an ECR pull token for chatbot image pulls using
      {{ chatbot_ecr_token_source }}. For instance_role, make sure the EC2
      instance profile role has scoped ECR pull permissions from terraform/aws-prep.
      For controller_profile, run `aws sso login --profile {{ aws_profile }}`.
  when:
    - chatbots_enabled | bool
    - chatbot_image_pull_secrets | default([], true) | length > 0
    - chatbot_ecr_pull_token_result.rc != 0

- name: Create or refresh chatbot ECR pull secret
  ansible.builtin.shell: |
    set -euo pipefail
    /usr/local/bin/kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml -n {{ item | quote }} \
      create secret docker-registry {{ ecr_pull_secret_name }} \
      --docker-server={{ ecr_registry }} \
      --docker-username=AWS \
      --docker-password={{ chatbot_ecr_pull_token_result.stdout | quote }} \
      --dry-run=client -o yaml \
      | /usr/local/bin/kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml apply -f -
  args:
    executable: /bin/bash
  loop: "{{ chatbot_namespaces }}"
  no_log: true
  register: chatbot_ecr_secret_apply
  changed_when: "'created' in chatbot_ecr_secret_apply.stdout or 'configured' in chatbot_ecr_secret_apply.stdout"
  failed_when: false
  when:
    - chatbots_enabled | bool
    - chatbot_image_pull_secrets | default([], true) | length > 0
  # - ansible.builtin.debug:
  #     var: chatbot_ecr_secret_apply.results

- name: Fail when chatbot ECR pull secret refresh failed
  ansible.builtin.fail:
    msg: >-
      Could not refresh ECR pull secret {{ ecr_pull_secret_name }} in one or
      more chatbot namespaces. Check the previous task output with no_log
      temporarily disabled if deeper troubleshooting is needed.
  when:
    - chatbots_enabled | bool
    - chatbot_image_pull_secrets | default([], true) | length > 0
    - chatbot_ecr_secret_apply.results | selectattr('rc', 'ne', 0) | list | length > 0

- name: Remove previous remote chatbot chart staging directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ chatbot_chart_remote_root }}"
  when: chatbots_enabled | bool

- name: Create remote chatbot chart staging directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user | default('root') }}"
    group: "{{ ansible_user | default('root') }}"
    mode: "0755"
  loop:
    - "{{ chatbot_chart_remote_root }}"
  when: chatbots_enabled | bool

- name: Copy chatbot Helm charts to remote host
  ansible.builtin.copy:
    src: "{{ item.src }}/"
    dest: "{{ item.dest }}/"
    owner: "{{ ansible_user | default('root') }}"
    group: "{{ ansible_user | default('root') }}"
    mode: "0644"
  loop:
    - src: "{{ chatbot_chart_local_path }}"
      dest: "{{ chatbot_chart_remote_root }}"
  when: chatbots_enabled | bool

- name: Create remote chatbot values directory
  ansible.builtin.file:
    path: "{{ chatbot_values_remote_dir }}"
    state: directory
    owner: "{{ ansible_user | default('root') }}"
    group: "{{ ansible_user | default('root') }}"
    mode: "0700"
  when: chatbots_enabled | bool

- name: Render chatbot Helm values
  ansible.builtin.template:
    src: values.yaml.j2
    dest: "{{ chatbot_values_remote_dir }}/{{ item.name }}.yaml"
    owner: "{{ ansible_user | default('root') }}"
    group: "{{ ansible_user | default('root') }}"
    mode: "0600"
  loop: "{{ chatbot_instances }}"
  no_log: true
  when: chatbots_enabled | bool

- name: Deploy chatbot releases
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - --install
      - "{{ item.release_name }}"
      - "{{ chatbot_chart_remote_root }}"
      - --namespace
      - "{{ item.namespace }}"
      - --create-namespace
      - --values
      - "{{ chatbot_values_remote_dir }}/{{ item.name }}.yaml"
      - --kubeconfig
      - /etc/rancher/k3s/k3s.yaml
  loop: "{{ chatbot_instances }}"
  no_log: true
  register: chatbot_helm_deploy
  changed_when: "'deployed' in chatbot_helm_deploy.stdout or 'upgraded' in chatbot_helm_deploy.stdout"
  when:
    - chatbots_enabled | bool
    - not chatbot_helm_wait | bool
  # - ansible.builtin.debug:
  #     var: chatbot_helm_deploy.stdout_lines

- name: Deploy chatbot releases and wait
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - --install
      - "{{ item.release_name }}"
      - "{{ chatbot_chart_remote_root }}"
      - --namespace
      - "{{ item.namespace }}"
      - --create-namespace
      - --values
      - "{{ chatbot_values_remote_dir }}/{{ item.name }}.yaml"
      - --wait
      - --timeout
      - "{{ chatbot_helm_timeout }}"
      - --kubeconfig
      - /etc/rancher/k3s/k3s.yaml
  loop: "{{ chatbot_instances }}"
  no_log: true
  register: chatbot_helm_wait_deploy
  changed_when: "'deployed' in chatbot_helm_wait_deploy.stdout or 'upgraded' in chatbot_helm_wait_deploy.stdout"
  when:
    - chatbots_enabled | bool
    - chatbot_helm_wait | bool
  # - ansible.builtin.debug:
  #     var: chatbot_helm_wait_deploy.stdout_lines

- name: Wait for current chatbot deployment rollouts
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubectl
      - --kubeconfig
      - /etc/rancher/k3s/k3s.yaml
      - rollout
      - status
      - "deployment/{{ item.release_name }}"
      - --namespace
      - "{{ item.namespace }}"
      - "--timeout={{ chatbot_helm_timeout }}"
  loop: "{{ chatbot_instances }}"
  changed_when: false
  register: chatbot_rollout_status
  no_log: true
  when: chatbots_enabled | bool
  # - ansible.builtin.debug:
  #     var: chatbot_rollout_status.results

- name: Set chatbot access URL facts
  ansible.builtin.set_fact:
    chatbot_access_urls: >-
      {{
        chatbot_access_urls | default([])
        + [
          item.name ~ ': ' ~
          (
            'https://' ~
            (
              public_ip
              if (public_ip is defined and public_ip | default('', true) | length > 0)
              else (ansible_host | default(inventory_hostname))
            )
            ~ ':' ~ (demo_https_gateway_chatbot_https_port | string)
            if demo_https_gateway_enabled | default(false) | bool
            else 'http://' ~
            (
              public_ip
              if (public_ip is defined and public_ip | default('', true) | length > 0)
              else (ansible_host | default(inventory_hostname))
            )
            ~ ':' ~ (item.node_port | string)
          )
        ]
      }}
  loop: "{{ chatbot_instances }}"
  no_log: true
  when: chatbots_enabled | bool
  # - ansible.builtin.debug:
  #     var: chatbot_access_urls

- name: Set chatbot HTTP fallback URL facts
  ansible.builtin.set_fact:
    chatbot_http_fallback_urls: >-
      {{
        chatbot_http_fallback_urls | default([])
        + [
          item.name ~ ': http://' ~
          (
            public_ip
            if (public_ip is defined and public_ip | default('', true) | length > 0)
            else (ansible_host | default(inventory_hostname))
          )
          ~ ':' ~ (item.node_port | string)
        ]
      }}
  loop: "{{ chatbot_instances }}"
  no_log: true
  when: chatbots_enabled | bool
  # - ansible.builtin.debug:
  #     var: chatbot_http_fallback_urls

- name: Show chatbot deployment summary
  ansible.builtin.debug:
    msg:
      - "Chatbot releases: {{ chatbot_instances | map(attribute='release_name') | join(', ') }}"
      - "Chatbot URLs: {{ chatbot_access_urls | default([]) | join(' | ') }}"
      - "Chatbot HTTP fallback URLs: {{ chatbot_http_fallback_urls | default([]) | join(' | ') }}"
