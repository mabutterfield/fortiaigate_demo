---
# FortiAIGate 8.0.2 lab management page (chatbot/lab-management/chart).
# Cluster-internal; instructors reach it through the lab login gateway at
# https://<host>:<chatbot HTTPS port>/manage/. See docs/lab-management.md.
lab_management_enabled: true
lab_management_namespace: lab-management
lab_management_release_name: lab-management
lab_management_service_port: 80
lab_management_chart_local_path: "{{ (playbook_dir + '/../../chatbot/lab-management/chart') | realpath }}"
lab_management_repo_root: "{{ (playbook_dir + '/../..') | realpath }}"
lab_management_chart_remote_root: "/home/{{ ansible_user }}/tmp/lab-management-chart"
lab_management_values_remote_path: "/home/{{ ansible_user }}/tmp/lab-management-values.yaml"
lab_management_image_repository: python
lab_management_image_tag: "3.12-slim"
lab_management_pvc_size: 1Gi
lab_management_storage_class: ""
lab_management_rollout_timeout: 300s
# Controller Python used to render catalog views (python3 -m catalog802 ...).
lab_management_catalog_python: python3
lab_management_catalog_views:
  - student
  - faig
lab_management_catalog_configmap_name: lab-catalog
# Optional exact browser origin for POSTs; empty derives it from the gateway's
# X-Forwarded-Proto/-Host headers.
lab_management_public_origin: ""
lab_management_auth_url: "http://{{ demo_https_gateway_release_name | default('demo-https-gateway') }}-auth.{{ demo_https_gateway_namespace | default('demo-https-gateway') }}.svc.cluster.local:{{ lab_gateway_auth_port | default(8090) }}"
# Broker caller token: copied from the gateway's caller Secret (key
# lab-management) into this namespace. Deploy the gateway first; without it the
# page still starts but FAIG actions report "broker not configured".
lab_management_caller_source_namespace: "{{ demo_https_gateway_namespace | default('demo-https-gateway') }}"
lab_management_caller_source_secret: "{{ lab_gateway_caller_secret_name | default('lab-gateway-callers') }}"
lab_management_caller_secret_name: lab-management-caller
