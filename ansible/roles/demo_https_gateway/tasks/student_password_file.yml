---
# Change 2026-11-23 (owner decision): optional instructor-owned student password file outside Git.
# lab_student_password_file is a path (tfvars -> terraform.generated.yml, or user.yml); empty disables
# the "From instructor file" mode. The file is parsed on the controller by lab_broker.py and stored in
# Secret <lab_data_namespace>/lab-student-passwords, readable only by lab_auth. Values are never printed.

- name: Inspect the instructor student password file
  ansible.builtin.stat:
    path: "{{ lab_student_password_file }}"
    follow: false
  delegate_to: localhost
  become: false
  register: lab_student_password_file_stat
  when: lab_student_password_file | length > 0
  # - ansible.builtin.debug:
  #     var: lab_student_password_file_stat.stat.mode

- name: Require an owner-only regular student password file
  ansible.builtin.assert:
    that:
      - lab_student_password_file_stat.stat.exists
      - lab_student_password_file_stat.stat.isreg
      - not lab_student_password_file_stat.stat.islnk
      - lab_student_password_file_stat.stat.mode in ['0600', '0400']
    fail_msg: >-
      lab_student_password_file must be an existing, owner-only (0600 or 0400) regular file, not a link:
      {{ lab_student_password_file }}
  when: lab_student_password_file | length > 0

- name: Parse the instructor student password file
  ansible.builtin.command:
    argv:
      - python3
      - "{{ demo_https_gateway_chart_local_path }}/files/lab_broker.py"
      - parse-student-passwords
      - "{{ lab_student_password_file }}"
      - "{{ faig_admin_static_password_file | default('') }}"
  delegate_to: localhost
  become: false
  register: lab_student_password_parse
  changed_when: false
  failed_when: false
  no_log: true
  when: lab_student_password_file | length > 0

- name: Stop when the student password file is rejected
  ansible.builtin.fail:
    msg: "{{ lab_student_password_parse.stderr | default('student password file rejected') }}"
  when:
    - lab_student_password_file | length > 0
    - lab_student_password_parse.rc != 0

- name: Store the student password policy for lab_auth
  ansible.builtin.shell: |
    set -euo pipefail
    /usr/local/bin/kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml apply -f - >/dev/null
    echo stored
  args:
    executable: /bin/bash
    stdin: >-
      {{ {'apiVersion': 'v1', 'kind': 'Secret', 'type': 'Opaque',
          'metadata': {'name': 'lab-student-passwords', 'namespace': lab_data_namespace,
                       'labels': {'app.kubernetes.io/part-of': 'lab-management'}},
          'data': {'policy': ((lab_student_password_parse.stdout | from_json).policy | to_json | b64encode)}} | to_json }}
  changed_when: true
  no_log: true
  when: lab_student_password_file | length > 0

- name: Show the student password file summary
  ansible.builtin.debug:
    msg: "Instructor student password file loaded: {{ (lab_student_password_parse.stdout | from_json).summary }}"
  when: lab_student_password_file | length > 0

- name: Remove the student password policy when no file is configured
  ansible.builtin.command:
    argv: [/usr/local/bin/kubectl, --kubeconfig, /etc/rancher/k3s/k3s.yaml, -n, "{{ lab_data_namespace }}",
           delete, secret, lab-student-passwords, --ignore-not-found]
  register: lab_student_password_remove
  changed_when: "'deleted' in lab_student_password_remove.stdout"
  when: lab_student_password_file | length == 0
  # - ansible.builtin.debug:
  #     var: lab_student_password_remove.stdout
