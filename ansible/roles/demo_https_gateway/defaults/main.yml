---
demo_https_gateway_enabled: false
demo_https_gateway_namespace: demo-https-gateway
demo_https_gateway_release_name: demo-https-gateway
demo_https_gateway_chart_local_path: "{{ playbook_dir }}/../../chatbot/https-gateway/chart"
demo_https_gateway_chart_remote_root: "/home/{{ ansible_user }}/tmp/demo-https-gateway-chart"
demo_https_gateway_values_remote_path: "/home/{{ ansible_user }}/tmp/demo-https-gateway-values.yaml"

demo_https_gateway_image_repository: nginx
# Change 2026-11-18: move to the current nginx stable line (1.27 is no longer current).
# demo_https_gateway_image_tag: "1.27-alpine"
demo_https_gateway_image_tag: "1.30-alpine"
demo_https_gateway_image_pull_policy: IfNotPresent
demo_https_gateway_resolver: "{{ k3s_cluster_dns | default('10.43.0.10') }}"

demo_https_gateway_self_signed: true
demo_https_gateway_cert_local_path: ""
demo_https_gateway_key_local_path: ""
demo_https_gateway_remote_cert_dir: "/home/{{ ansible_user }}/tmp/demo-https-gateway-cert"
demo_https_gateway_remote_cert_path: "{{ demo_https_gateway_remote_cert_dir }}/tls.crt"
demo_https_gateway_remote_key_path: "{{ demo_https_gateway_remote_cert_dir }}/tls.key"
demo_https_gateway_cert_common_name: "fortiaigate-demo.local"
demo_https_gateway_cert_days: 365

demo_https_gateway_openwebui_https_port: "{{ demo_openwebui_https_port | default(30443) }}"
demo_https_gateway_chatbot_https_port: "{{ demo_chatbot_https_port | default(30444) }}"
demo_https_gateway_demo_home_https_port: "{{ demo_home_https_port | default(30445) }}"
demo_https_gateway_litellm_https_port: "{{ demo_litellm_https_port | default(30446) }}"
demo_https_gateway_mcp_https_port: "{{ demo_mcp_https_port | default(30447) }}"

demo_https_gateway_routes:
  - name: chatbot
    display_name: Chat Front-End
    external_port: "{{ demo_https_gateway_chatbot_https_port }}"
    # Lab login gateway: HTTP listener on the chatbot HTTP port, sign-in required.
    plain_port: "{{ lab_gateway_http_port if lab_gateway_enabled | bool else '' }}"
    auth: "{{ lab_gateway_enabled | bool }}"
    # Change 2026-11-18: with the lab gateway on, the route serves the 8.0.2
    # student lab chatbot (or the "who am I" placeholder); the 8.0.1 chatbot
    # upstream remains for lab_gateway_enabled: false.
    upstream: >-
      {{
        ('http://127.0.0.1:' ~ lab_gateway_auth_port)
        if (lab_gateway_enabled | bool and lab_gateway_chatbot_placeholder | bool)
        else ('http://' ~ (lab_chatbot_release_name | default('lab-chatbot')) ~ '.'
              ~ (lab_chatbot_namespace | default('lab-chatbot')) ~ '.svc.cluster.local:'
              ~ (lab_chatbot_service_port | default(80)))
        if lab_gateway_enabled | bool
        else ('http://' ~ (chatbot_instances[0].release_name | default('chatbot')) ~ '.'
              ~ (chatbot_instances[0].namespace | default('chatbot')) ~ '.svc.cluster.local:80')
      }}
    # Change 2026-11-19: instructor Lab Management page at /manage/ on the
    # same signed-in address (prefix stripped before proxying).
    prefix_routes: >-
      {{
        [{'path': '/manage/',
          'upstream': 'http://' ~ (lab_management_release_name | default('lab-management')) ~ '.'
                      ~ (lab_management_namespace | default('lab-management')) ~ '.svc.cluster.local:'
                      ~ (lab_management_service_port | default(80))}]
        if (lab_gateway_enabled | bool and lab_management_enabled | default(true) | bool)
        else []
      }}
  - name: demo-home
    display_name: Demo Home
    external_port: "{{ demo_https_gateway_demo_home_https_port }}"
    upstream: "http://{{ demo_home_release_name | default('demo-home') }}.{{ demo_home_namespace | default('demo-home') }}.svc.cluster.local:80"
  - name: litellm
    display_name: LiteLLM Admin/API
    external_port: "{{ demo_https_gateway_litellm_https_port }}"
    upstream: "http://{{ litellm_release_name | default('litellm') }}.{{ litellm_namespace | default('litellm') }}.svc.cluster.local:{{ litellm_service_port | default(4000) }}"
  - name: mcp
    display_name: MCP Demo Tools
    external_port: "{{ demo_https_gateway_mcp_https_port }}"
    health_path: /tools
    upstream: "http://{{ mcp_release_name | default('mcp-demo') }}.{{ mcp_namespace | default('mcp') }}.svc.cluster.local:{{ mcp_service_port | default(8000) }}"

# Lab login gateway (auth sidecar in this release). Students and FAIG super
# admins sign in with their FortiAIGate account; routes with auth: true receive
# HMAC-signed X-Lab-* identity headers. HTTP logins redirect to HTTPS.
lab_gateway_enabled: true
lab_gateway_http_port: "{{ demo_chatbot_http_port | default(30081) }}"
lab_gateway_auth_port: 8090
lab_gateway_faig_url: "https://ingress-nginx-controller.ingress-nginx.svc.cluster.local"
lab_gateway_faig_verify_tls: false
lab_gateway_max_session_hours: 8
lab_gateway_idle_minutes: 120
# faig (default) or fallback (salted hashes from lab_gateway_fallback_secret_name).
lab_gateway_mode: faig
lab_gateway_signing_secret_name: lab-gateway-signing
# Change 2026-11-19: per-caller bearer tokens for lab_auth broker endpoints
# (/_lab/internal/ on the auth service port). Each caller's role copies its own
# token into its namespace.
lab_gateway_caller_secret_name: lab-gateway-callers
lab_gateway_callers:
  - lab-management
# Change 2026-11-19: student roster and passwords live in two Secrets in this
# namespace, readable and patchable only by lab_auth. Students are
# student<NN>@<domain>.
lab_data_namespace: lab-data
lab_gateway_student_domain: fortiai.lab
# Change 2026-11-19: always keep a fallback Secret so admin password resets
# (lab chatbot Admin tab) store matching fallback hashes; mode stays faig.
# lab_gateway_fallback_secret_name: ""
lab_gateway_fallback_secret_name: lab-gateway-fallback
# Serve the auth service's "who am I" page on the chatbot route instead of the
# student lab chatbot (deploy_lab_chatbot.yml).
# Change 2026-11-18: the lab chatbot exists now; placeholder follows lab_chatbot_enabled.
# lab_gateway_chatbot_placeholder: true
lab_gateway_chatbot_placeholder: "{{ not (lab_chatbot_enabled | default(true) | bool) }}"

