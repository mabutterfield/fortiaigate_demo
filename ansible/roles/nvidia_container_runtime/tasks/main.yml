---
- name: Install NVIDIA container toolkit repository
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey \
      | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
    curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list \
      | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' \
      > /etc/apt/sources.list.d/nvidia-container-toolkit.list
  args:
    executable: /bin/bash
    creates: /etc/apt/sources.list.d/nvidia-container-toolkit.list
  register: nvidia_container_toolkit_repo
  retries: "{{ nvidia_container_runtime_repo_retries | int }}"
  delay: "{{ nvidia_container_runtime_repo_retry_delay | int }}"
  until: nvidia_container_toolkit_repo is succeeded

- name: Refresh apt cache after NVIDIA toolkit repository
  ansible.builtin.apt:
    update_cache: true
  when: nvidia_container_toolkit_repo.changed
  register: nvidia_container_runtime_cache_update
  retries: "{{ nvidia_container_runtime_apt_retries | int }}"
  delay: "{{ nvidia_container_runtime_apt_retry_delay | int }}"
  until: nvidia_container_runtime_cache_update is succeeded

- name: Install NVIDIA container runtime packages
  ansible.builtin.apt:
    name:
      - nvidia-container-toolkit
      # CHANGED: nvidia-container-runtime is no longer required separately on Ubuntu 24.04;
      # nvidia-container-toolkit provides nvidia-ctk and the runtime integration used below.
      # - nvidia-container-runtime
    state: present
    update_cache: true
  register: nvidia_container_runtime_install
  retries: "{{ nvidia_container_runtime_apt_retries | int }}"
  delay: "{{ nvidia_container_runtime_apt_retry_delay | int }}"
  until: nvidia_container_runtime_install is succeeded

# CHANGED: k3s generates containerd configuration. Do not modify the generated
# file or infer k3s configuration from an unrelated system containerd snippet.
- name: Check k3s generated NVIDIA runtime handler
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import os
        import sys
        import tomllib

        with open(sys.argv[1], "rb") as config_file:
            config = tomllib.load(config_file)
        plugins = config.get("plugins", {})
        runtimes = [
            plugin.get("containerd", {}).get("runtimes", {}).get("nvidia", {})
            for plugin in plugins.values() if isinstance(plugin, dict)
        ]
        binaries = [runtime.get("options", {}).get("BinaryName", "") for runtime in runtimes]
        if not any(binary and os.path.isfile(binary) and os.access(binary, os.X_OK) for binary in binaries):
            sys.exit("k3s NVIDIA runtime handler or executable is missing")
        print("k3s NVIDIA runtime:", next(binary for binary in binaries if binary and os.path.isfile(binary) and os.access(binary, os.X_OK)))
      - /var/lib/rancher/k3s/agent/etc/containerd/config.toml
  register: nvidia_k3s_handler_before
  changed_when: false
  failed_when: false
  # - ansible.builtin.debug:
  #     var: nvidia_k3s_handler_before.stdout_lines

- name: Restart k3s to discover installed NVIDIA runtime
  ansible.builtin.systemd:
    name: k3s
    state: restarted
  when: nvidia_container_runtime_install.changed or nvidia_k3s_handler_before.rc != 0

- name: Verify k3s generated NVIDIA runtime handler
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import os
        import sys
        import tomllib

        with open(sys.argv[1], "rb") as config_file:
            config = tomllib.load(config_file)
        plugins = config.get("plugins", {})
        runtimes = [
            plugin.get("containerd", {}).get("runtimes", {}).get("nvidia", {})
            for plugin in plugins.values() if isinstance(plugin, dict)
        ]
        binaries = [runtime.get("options", {}).get("BinaryName", "") for runtime in runtimes]
        if not any(binary and os.path.isfile(binary) and os.access(binary, os.X_OK) for binary in binaries):
            sys.exit("k3s NVIDIA runtime handler or executable is missing")
        print("k3s NVIDIA runtime:", next(binary for binary in binaries if binary and os.path.isfile(binary) and os.access(binary, os.X_OK)))
      - /var/lib/rancher/k3s/agent/etc/containerd/config.toml
  register: nvidia_k3s_handler_after
  changed_when: false
  retries: 12
  delay: 5
  until: nvidia_k3s_handler_after.rc == 0
  # - ansible.builtin.debug:
  #     var: nvidia_k3s_handler_after.stdout_lines

