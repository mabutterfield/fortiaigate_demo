---
- name: Validate 8.0.2 deployment inputs
  ansible.builtin.assert:
    that:
      - fortiaigate_chart_path is directory
      - fortiaigate_image_repository | default('') | length > 0
      - fortiaigate_image_tag | default('') | length > 0
      - fortiaigate_gpu_profile | length > 0
      - fortiaigate_vllm_gpu_attach in ['shared', 'dedicated']
      - registry_type | default('ecr') == 'ecr'
      - fortiaigate_ecr_token_source == 'instance_role'
      - ecr_registry | default('') | length > 0
      - fortiaigate_image_pull_secrets | length == 1
      - fortiaigate_image_pull_secrets[0].name == ecr_pull_secret_name
      - not (fortiaigate_tls_enabled | bool) or fortiaigate_ssl_cert_path is file
      - not (fortiaigate_tls_enabled | bool) or fortiaigate_ssl_key_path is file
    fail_msg: "8.0.2 currently requires a chart, an explicit GPU profile, TLS files, and an instance-role ECR pull secret."

- name: Ensure FortiAIGate namespace exists
  ansible.builtin.shell: |
    set -euo pipefail
    /usr/local/bin/kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml create namespace {{ fortiaigate_namespace | quote }} --dry-run=client -o yaml | /usr/local/bin/kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml apply -f -
  args:
    executable: /bin/bash
  register: faig_802_namespace
  changed_when: "'created' in faig_802_namespace.stdout or 'configured' in faig_802_namespace.stdout"
  # - ansible.builtin.debug:
  #     var: faig_802_namespace.stdout_lines

- name: Install instance-role ECR refresh script and timer
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {src: ecr-refresh-802.sh.j2, dest: /usr/local/sbin/fortiaigate-ecr-refresh, mode: '0700'}
    - {src: ecr-refresh-802.service.j2, dest: /etc/systemd/system/fortiaigate-ecr-refresh.service, mode: '0644'}
    - {src: ecr-refresh-802.timer.j2, dest: /etc/systemd/system/fortiaigate-ecr-refresh.timer, mode: '0644'}
  register: faig_802_refresh_files
  # - ansible.builtin.debug:
  #     var: faig_802_refresh_files.results

- name: Enable periodic ECR token refresh
  ansible.builtin.systemd:
    name: fortiaigate-ecr-refresh.timer
    daemon_reload: "{{ faig_802_refresh_files.changed }}"
    enabled: true
    state: started

- name: Refresh ECR pull secret now
  ansible.builtin.command: /usr/local/sbin/fortiaigate-ecr-refresh
  register: faig_802_refresh
  changed_when: true
  no_log: true
  # - ansible.builtin.debug:
  #     var: faig_802_refresh.rc

# Pull the large GPU images before submitting the chart. A pull pod may fail
# to execute /bin/true in a minimal image; the verified cached image is the gate.
- name: Pre-pull 8.0.2 GPU and model images
  ansible.builtin.include_tasks: prefetch_image_802.yml
  loop:
    - "{{ fortiaigate_image_repository }}/faig-models:{{ fortiaigate_models_image_tag }}"
    - "{{ fortiaigate_image_repository }}/vllm-server:{{ fortiaigate_vllm_image_tag }}"
    - "{{ fortiaigate_image_repository }}/custom-triton:{{ fortiaigate_triton_image_tag }}"
  loop_control:
    loop_var: faig_prefetch_image
  when: fortiaigate_prefetch_images | bool

- name: Ensure local chart archive directory exists
  ansible.builtin.file:
    path: "{{ fortiaigate_chart_archive_local_path | dirname }}"
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false

- name: Package 8.0.2 chart without platform metadata
  ansible.builtin.command:
    argv: [tar, -czf, "{{ fortiaigate_chart_archive_local_path }}", '--exclude=.DS_Store', '--exclude=._*', -C, "{{ fortiaigate_chart_path }}", .]
  environment:
    COPYFILE_DISABLE: '1'
  delegate_to: localhost
  become: false
  changed_when: true
  register: faig_802_chart_archive
  # - ansible.builtin.debug:
  #     var: faig_802_chart_archive.rc

- name: Create 8.0.2 chart staging directory
  ansible.builtin.file:
    path: "{{ fortiaigate_chart_remote_root }}-802"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Unpack 8.0.2 chart on host
  ansible.builtin.unarchive:
    src: "{{ fortiaigate_chart_archive_local_path }}"
    dest: "{{ fortiaigate_chart_remote_root }}-802"
    owner: root
    group: root

- name: Stage custom TLS files in the chart copy
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ fortiaigate_chart_remote_root }}-802/{{ item.dest }}"
    owner: root
    group: root
    mode: '0600'
  loop:
    - {src: "{{ fortiaigate_ssl_cert_path }}", dest: "{{ fortiaigate_ssl_cert_chart_path }}"}
    - {src: "{{ fortiaigate_ssl_key_path }}", dest: "{{ fortiaigate_ssl_key_chart_path }}"}
  when: fortiaigate_tls_enabled | bool
  no_log: true

- name: Render 8.0.2 values
  ansible.builtin.template:
    src: fortiaigate-802-values.yaml.j2
    dest: "{{ fortiaigate_values_remote_path }}"
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Install 8.0.2 GPU post-renderer
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../k8s-overlays/bin/post_render_fortiaigate_802.py"
    dest: "{{ fortiaigate_post_renderer_remote_path }}"
    owner: root
    group: root
    mode: '0755'

- name: Lint staged 8.0.2 chart
  ansible.builtin.command:
    argv: [helm, lint, "{{ fortiaigate_chart_remote_root }}-802", -f, "{{ fortiaigate_values_remote_path }}"]
  register: faig_802_helm_lint
  changed_when: false
  # - ansible.builtin.debug:
  #     var: faig_802_helm_lint.stdout_lines

- name: Render 8.0.2 chart before deployment
  ansible.builtin.command:
    argv: [helm, template, "{{ fortiaigate_release_name }}", "{{ fortiaigate_chart_remote_root }}-802", -n, "{{ fortiaigate_namespace }}", -f, "{{ fortiaigate_values_remote_path }}", --post-renderer, "{{ fortiaigate_post_renderer_remote_path }}"]
  register: faig_802_helm_render
  changed_when: false
  no_log: true
  # - ansible.builtin.debug:
  #     var: faig_802_helm_render.rc

- name: Deploy 8.0.2 chart
  ansible.builtin.command:
    argv: [helm, upgrade, --install, "{{ fortiaigate_release_name }}", "{{ fortiaigate_chart_remote_root }}-802", -n, "{{ fortiaigate_namespace }}", -f, "{{ fortiaigate_values_remote_path }}", --post-renderer, "{{ fortiaigate_post_renderer_remote_path }}", --kubeconfig, /etc/rancher/k3s/k3s.yaml]
  register: faig_802_helm_deploy
  changed_when: "'deployed' in faig_802_helm_deploy.stdout or 'upgraded' in faig_802_helm_deploy.stdout"
  # - ansible.builtin.debug:
  #     var: faig_802_helm_deploy.stdout_lines

- name: Explain 8.0.2 license activation
  ansible.builtin.debug:
    msg: "Upload the 8.0.2 license through the FortiAIGate administrator interface after the application is ready."
