---
# CHANGED: keep the 8.0.1 deployment intact in legacy.yml; 8.0.2 uses a
# separate license, chart values, and GPU runtime integration.
- name: Deploy FortiAIGate 8.0.2
  ansible.builtin.include_tasks: release_802.yml
  when: fortiaigate_version == '8.0.2'

- name: Deploy the legacy FortiAIGate release
  ansible.builtin.include_tasks: legacy.yml
  when: fortiaigate_version is version('8.0.2', '<')

- name: Reject unsupported FortiAIGate releases
  ansible.builtin.assert:
    that:
      - fortiaigate_version is version('8.0.2', '<=')
    fail_msg: "This deployment role has not been reviewed for releases after 8.0.2."
