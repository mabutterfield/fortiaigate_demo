---
- name: Validate LiteLLM proxy
  hosts: fortiaigate
  become: true
  pre_tasks:
    - name: Load environment, generated, and local group vars when present
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop: >-
        {{
          query('ansible.builtin.fileglob', playbook_dir + '/../group_vars/env.yml')
          + query('ansible.builtin.fileglob', playbook_dir + '/../group_vars/images.yml')
          + query('ansible.builtin.fileglob', playbook_dir + '/../group_vars/system.yml')
          + (query('ansible.builtin.fileglob', playbook_dir + '/../group_vars/terraform.generated.yml') if (deployment_target | default(lookup('ansible.builtin.env', 'FAIG_DEPLOYMENT_TARGET') | default('aws', true))) == 'aws' else [])
          + (query('ansible.builtin.fileglob', playbook_dir + '/../group_vars/ecr.generated.yml') if (deployment_target | default(lookup('ansible.builtin.env', 'FAIG_DEPLOYMENT_TARGET') | default('aws', true))) == 'aws' else [])
          + (query('ansible.builtin.fileglob', playbook_dir + '/../group_vars/registry.generated.yml') if (deployment_target | default(lookup('ansible.builtin.env', 'FAIG_DEPLOYMENT_TARGET') | default('aws', true))) == 'local' else [])
          + (query('ansible.builtin.fileglob', playbook_dir + '/../group_vars/ports.generated.yml') if (deployment_target | default(lookup('ansible.builtin.env', 'FAIG_DEPLOYMENT_TARGET') | default('aws', true))) == 'aws' else [])
          + (query('ansible.builtin.fileglob', playbook_dir + '/../group_vars/local.generated.yml') if (deployment_target | default(lookup('ansible.builtin.env', 'FAIG_DEPLOYMENT_TARGET') | default('aws', true))) == 'local' else [])
          + (query('ansible.builtin.fileglob', playbook_dir + '/../group_vars/local.secrets.yml') if (deployment_target | default(lookup('ansible.builtin.env', 'FAIG_DEPLOYMENT_TARGET') | default('aws', true))) == 'local' else [])
          + query('ansible.builtin.fileglob', playbook_dir + '/../group_vars/user.yml')
        }}
  roles:
    - role: litellm_status
      vars:
        litellm_status_fail_on_not_ready: true

