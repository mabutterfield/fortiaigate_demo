---
- name: Validate demo HTTP paths direct and through FortiWeb
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  pre_tasks:
    - name: Determine HTTP validation deployment target
      ansible.builtin.set_fact:
        demo_http_paths_playbook_deployment_target: >-
          {{
            hostvars[(groups.get('fortiaigate', []) | first)].deployment_target | default(deployment_target | default('aws', true), true)
            if (groups.get('fortiaigate', []) | length > 0)
            else (
              lookup('ansible.builtin.env', 'FAIG_DEPLOYMENT_TARGET') | default('', true) | trim
              if lookup('ansible.builtin.env', 'FAIG_DEPLOYMENT_TARGET') | default('', true) | trim | length > 0
              else deployment_target | default('aws', true)
            )
          }}
      # - ansible.builtin.debug:
      #     var: demo_http_paths_playbook_deployment_target

    - name: Load environment, generated, and local group vars when present
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop: >-
        {{
          query('ansible.builtin.fileglob', playbook_dir + '/../group_vars/env.yml')
          + query('ansible.builtin.fileglob', playbook_dir + '/../group_vars/images.yml')
          + query('ansible.builtin.fileglob', playbook_dir + '/../group_vars/system.yml')
          + (query('ansible.builtin.fileglob', playbook_dir + '/../group_vars/terraform.generated.yml') if demo_http_paths_playbook_deployment_target == 'aws' else [])
          + (query('ansible.builtin.fileglob', playbook_dir + '/../group_vars/ecr.generated.yml') if demo_http_paths_playbook_deployment_target == 'aws' else [])
          + (query('ansible.builtin.fileglob', playbook_dir + '/../group_vars/registry.generated.yml') if demo_http_paths_playbook_deployment_target == 'local' else [])
          + (query('ansible.builtin.fileglob', playbook_dir + '/../group_vars/ports.generated.yml') if demo_http_paths_playbook_deployment_target == 'aws' else [])
          + (query('ansible.builtin.fileglob', playbook_dir + '/../group_vars/local.generated.yml') if demo_http_paths_playbook_deployment_target == 'local' else [])
          + (query('ansible.builtin.fileglob', playbook_dir + '/../group_vars/local.secrets.yml') if demo_http_paths_playbook_deployment_target == 'local' else [])
          + query('ansible.builtin.fileglob', playbook_dir + '/../group_vars/user.yml')
        }}
      tags: [always]

    - name: Set resolved HTTP validation deployment target
      ansible.builtin.set_fact:
        deployment_target: "{{ demo_http_paths_playbook_deployment_target }}"
      tags: [always]
      # - ansible.builtin.debug:
      #     var: deployment_target
  roles:
    - demo_http_paths_test
