# Replace image, origin and gateway service before applying. Route a dedicated
# authenticated hostname to this ClusterIP service; see README.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: instructor-state
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: instructor-management
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: instructor-management
  template:
    metadata:
      labels:
        app: instructor-management
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: management
          image: REPLACE_WITH_MANAGEMENT_IMAGE
          ports:
            - containerPort: 8080
          env:
            - name: INSTRUCTOR_AUTH_URL
              value: http://REPLACE_WITH_GATEWAY_AUTH_SERVICE:8080
            - name: INSTRUCTOR_PUBLIC_ORIGIN
              value: https://REPLACE_WITH_INSTRUCTOR_HOST
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: state
              mountPath: /data
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: instructor-state
---
apiVersion: v1
kind: Service
metadata:
  name: instructor-management
spec:
  type: ClusterIP
  selector:
    app: instructor-management
  ports:
    - port: 8080
      targetPort: 8080
