# Application code and static page (stock python image; no custom build).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lab-management.name" . }}
  labels:
{{ include "lab-management.labels" . | indent 4 }}
data:
{{- range $path, $_ := .Files.Glob "files/*" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
