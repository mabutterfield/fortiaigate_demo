apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "demo-https-gateway.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "demo-https-gateway.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "demo-https-gateway.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/tls: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ include "demo-https-gateway.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
{{- if and .Values.labAuth.enabled .Values.labAuth.fallbackSecretName }}
      serviceAccountName: {{ include "demo-https-gateway.name" . }}-lab-auth
{{- end }}
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
{{- range .Values.routes }}
            - name: {{ .name | trunc 15 | trimSuffix "-" }}
              containerPort: {{ .externalPort }}
              protocol: TCP
{{- if .plainPort }}
            - name: {{ printf "%s-http" .name | trunc 15 | trimSuffix "-" }}
              containerPort: {{ .plainPort }}
              protocol: TCP
{{- end }}
{{- end }}
          readinessProbe:
            tcpSocket:
              port: {{ (index .Values.routes 0).externalPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: {{ (index .Values.routes 0).externalPort }}
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
{{- if .Values.labAuth.enabled }}
        - name: lab-auth
          image: "{{ .Values.labAuth.image.repository }}:{{ .Values.labAuth.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "/app/lab_auth.py"]
          env:
            - name: LAB_AUTH_PORT
              value: "{{ .Values.labAuth.port }}"
            - name: LAB_FAIG_URL
              value: {{ .Values.labAuth.faigUrl | quote }}
            - name: LAB_FAIG_VERIFY_TLS
              value: "{{ .Values.labAuth.faigVerifyTls }}"
            - name: LAB_HTTPS_PORT
              value: "{{ .Values.labAuth.httpsPort }}"
            - name: LAB_MAX_SESSION_HOURS
              value: "{{ .Values.labAuth.maxSessionHours }}"
            - name: LAB_IDLE_MINUTES
              value: "{{ .Values.labAuth.idleMinutes }}"
            - name: LAB_AUTO_APPROVE_SECONDS
              value: "{{ .Values.labAuth.autoApproveSeconds | default 60 }}"
            - name: LAB_AUTH_MODE
              value: {{ .Values.labAuth.mode | quote }}
            - name: LAB_SIGNING_KEY_FILE
              value: /etc/lab-auth/signing/hmac-key
            - name: LAB_CALLER_TOKEN_DIR
              value: /etc/lab-auth/callers
            - name: LAB_DATA_NAMESPACE
              value: {{ .Values.labAuth.labDataNamespace | quote }}
            - name: LAB_STUDENT_DOMAIN
              value: {{ .Values.labAuth.studentDomain | quote }}
{{- if .Values.labAuth.fallbackSecretName }}
            - name: LAB_FALLBACK_FILE
              value: /etc/lab-auth/fallback/fallback.json
            - name: LAB_FALLBACK_SECRET
              value: {{ .Values.labAuth.fallbackSecretName | quote }}
            - name: LAB_NAMESPACE
              value: {{ .Release.Namespace | quote }}
{{- end }}
          ports:
            - name: lab-auth
              containerPort: {{ .Values.labAuth.port }}
          readinessProbe:
            httpGet:
              path: /_lab/health
              port: lab-auth
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_lab/health
              port: lab-auth
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /app/lab_auth.py
              subPath: lab_auth.py
              readOnly: true
            - name: config
              mountPath: /app/lab_broker.py
              subPath: lab_broker.py
              readOnly: true
            - name: lab-callers
              mountPath: /etc/lab-auth/callers
              readOnly: true
            - name: lab-signing
              mountPath: /etc/lab-auth/signing
              readOnly: true
{{- if .Values.labAuth.fallbackSecretName }}
            - name: lab-fallback
              mountPath: /etc/lab-auth/fallback
              readOnly: true
{{- end }}
{{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "demo-https-gateway.name" . }}
        - name: tls
          secret:
            secretName: {{ include "demo-https-gateway.name" . }}-tls
{{- if .Values.labAuth.enabled }}
        - name: lab-signing
          secret:
            secretName: {{ .Values.labAuth.signingSecretName }}
        # Per-caller bearer tokens (one key per caller name); optional so the
        # gateway starts before any caller is configured.
        - name: lab-callers
          secret:
            secretName: {{ .Values.labAuth.callerSecretName }}
            optional: true
{{- if .Values.labAuth.fallbackSecretName }}
        - name: lab-fallback
          secret:
            secretName: {{ .Values.labAuth.fallbackSecretName }}
{{- end }}
{{- end }}
