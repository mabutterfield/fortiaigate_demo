{{- define "demo-https-gateway.proxyHeaders" }}
          proxy_http_version 1.1;
          proxy_set_header Host $http_host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Host $http_host;
          proxy_set_header X-Forwarded-Port $server_port;
          proxy_set_header X-Forwarded-Proto $lab_scheme;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_read_timeout 3600;
          proxy_send_timeout 3600;
{{- end }}
{{- define "demo-https-gateway.locations" }}
{{- $route := .route }}
{{- $root := .root }}
{{- if and $route.auth $root.Values.labAuth.enabled }}
        # Lab login gateway: every request is checked by the auth sidecar.
        location = /_lab_auth {
          internal;
          proxy_pass http://127.0.0.1:{{ $root.Values.labAuth.port }}/_lab/verify;
          proxy_pass_request_body off;
          proxy_set_header Content-Length "";
          proxy_set_header Cookie $http_cookie;
          proxy_set_header X-Forwarded-Proto $lab_scheme;
        }

        # Change 2026-11-19: internal broker endpoints are for in-cluster callers
        # (auth service port) only, never through the public gateway.
        location /_lab/internal/ {
          return 404;
        }

        location /_lab/ {
          proxy_pass http://127.0.0.1:{{ $root.Values.labAuth.port }};
{{- include "demo-https-gateway.proxyHeaders" . }}
        }

        location @lab_login {
          return 302 /_lab/login?next=$request_uri;
        }
{{- range $route.prefixRoutes }}

        # Signed-in path prefix served by another upstream (prefix stripped).
        location = {{ trimSuffix "/" .path }} {
          return 301 {{ .path }};
        }

        location {{ .path }} {
          auth_request /_lab_auth;
          auth_request_set $lab_user $upstream_http_x_lab_user;
          auth_request_set $lab_student $upstream_http_x_lab_student;
          auth_request_set $lab_role $upstream_http_x_lab_role;
          auth_request_set $lab_workspace_id $upstream_http_x_lab_workspace_id;
          auth_request_set $lab_ts $upstream_http_x_lab_ts;
          auth_request_set $lab_signature $upstream_http_x_lab_signature;
          auth_request_set $lab_session $upstream_http_x_lab_session;
          error_page 401 = @lab_login;
          proxy_set_header X-Lab-User $lab_user;
          proxy_set_header X-Lab-Student $lab_student;
          proxy_set_header X-Lab-Role $lab_role;
          proxy_set_header X-Lab-Workspace-Id $lab_workspace_id;
          proxy_set_header X-Lab-Ts $lab_ts;
          proxy_set_header X-Lab-Signature $lab_signature;
          proxy_set_header X-Lab-Session $lab_session;
          # set must come before rewrite...break, which ends rewrite-module processing.
          set $proxy_upstream "{{ .upstream }}";
          rewrite ^{{ trimSuffix "/" .path }}/(.*)$ /$1 break;
          proxy_pass $proxy_upstream;
{{- include "demo-https-gateway.proxyHeaders" . }}
          proxy_redirect ~^http://[^/]+(/.*)$ $lab_scheme://$http_host{{ trimSuffix "/" .path }}$1;
        }
{{- end }}

        location / {
          auth_request /_lab_auth;
          auth_request_set $lab_user $upstream_http_x_lab_user;
          auth_request_set $lab_student $upstream_http_x_lab_student;
          auth_request_set $lab_role $upstream_http_x_lab_role;
          auth_request_set $lab_workspace_id $upstream_http_x_lab_workspace_id;
          auth_request_set $lab_ts $upstream_http_x_lab_ts;
          auth_request_set $lab_signature $upstream_http_x_lab_signature;
          auth_request_set $lab_session $upstream_http_x_lab_session;
          error_page 401 = @lab_login;
          # Overwrite any client-supplied identity headers with the signed values.
          proxy_set_header X-Lab-User $lab_user;
          proxy_set_header X-Lab-Student $lab_student;
          proxy_set_header X-Lab-Role $lab_role;
          proxy_set_header X-Lab-Workspace-Id $lab_workspace_id;
          proxy_set_header X-Lab-Ts $lab_ts;
          proxy_set_header X-Lab-Signature $lab_signature;
          proxy_set_header X-Lab-Session $lab_session;
          set $proxy_upstream "{{ $route.upstream }}";
          proxy_pass $proxy_upstream;
{{- include "demo-https-gateway.proxyHeaders" . }}
          proxy_redirect ~^http://[^/]+(/.*)$ $lab_scheme://$http_host$1;
        }
{{- else }}
        location / {
          set $proxy_upstream "{{ $route.upstream }}";
          proxy_pass $proxy_upstream;
{{- include "demo-https-gateway.proxyHeaders" . }}
          proxy_redirect ~^http://[^/]+(/.*)$ $lab_scheme://$http_host$1;
        }
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "demo-https-gateway.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "demo-https-gateway.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  nginx.conf: |
    events {}

    http {
      resolver {{ .Values.resolver }} valid=10s ipv6=off;
      client_max_body_size 64m;

      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }

{{- range .Values.routes }}
      server {
        listen {{ .externalPort }} ssl;
        server_name _;
        set $lab_scheme https;

        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
{{ include "demo-https-gateway.locations" (dict "route" . "root" $) }}
      }
{{- if .plainPort }}

      server {
        listen {{ .plainPort }};
        server_name _;
        set $lab_scheme http;
{{ include "demo-https-gateway.locations" (dict "route" . "root" $) }}
      }
{{- end }}
{{- end }}
    }
{{- if .Values.labAuth.enabled }}
  lab_auth.py: |
{{ .Files.Get "files/lab_auth.py" | indent 4 }}
  lab_broker.py: |
{{ .Files.Get "files/lab_broker.py" | indent 4 }}
{{- end }}
