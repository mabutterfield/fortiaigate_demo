# Defaults for the student lab chatbot. Ansible (roles/lab_chatbot) renders
# the real values; faig_agent.py and scenario-pack.json are copied into
# files/ on the target host before install and are not tracked here.
nameOverride: lab-chatbot

image:
  repository: python
  tag: "3.12-slim"
  pullPolicy: IfNotPresent

port: 8501
servicePort: 80
title: FortiAIGate Lab Chatbot

faigUrl: https://ingress-nginx-controller.ingress-nginx.svc.cluster.local/ai/openai/v1
faigVerifyTls: false
directUrl: http://litellm.litellm.svc.cluster.local:4000/v1
mcpUrl: http://mcp-demo.mcp.svc.cluster.local:8001/mcp
authUrl: http://demo-https-gateway-auth.demo-https-gateway.svc.cluster.local:8090
maxTokens: 2048
temperature: "0.0"
# GUI-only install: inspection off, tests not graded.
guiOnly: false

# Secrets created by Ansible in the release namespace (not Helm-managed).
signingSecretName: lab-chatbot-signing
directKeySecretName: lab-chatbot-direct
# Bearer token for gateway broker calls (key: token); optional.
callerSecretName: lab-chatbot-caller
# Change 2026-11-19: catalog view ConfigMap and FAIG's configured block message
# (used for the "Block message shown" evidence).
catalogConfigMapName: lab-catalog
blockMessage: "This request was blocked by FortiAIGate as it triggered our safety systems."
# Old per-namespace key Secrets (lab-keys-*/lab-seed-*) and their RBAC; off now.
legacyKeySecrets: false
keySecretPrefix: lab-keys-
# Instructor seed copies, rewritten by every deploy; the app may only read them.
seedSecretPrefix: lab-seed-

# Students the app may read and update keys for (RBAC resourceNames and the
# admin "act as student" list).
students: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi
