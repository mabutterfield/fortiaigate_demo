# The chatbot may read and update only the named per-student key Secrets and
# read the instructor seed copies. It cannot list, create, or delete Secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lab-chatbot.name" . }}
  labels:
{{ include "lab-chatbot.labels" . | indent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "lab-chatbot.name" . }}-student-keys
  labels:
{{ include "lab-chatbot.labels" . | indent 4 }}
rules:
{{- if .Values.students }}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"]
    resourceNames:
{{- range .Values.students }}
      - {{ printf "%s%s" $.Values.keySecretPrefix . | quote }}
{{- end }}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames:
{{- range .Values.students }}
      - {{ printf "%s%s" $.Values.seedSecretPrefix . | quote }}
{{- end }}
{{- else }}
  []
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "lab-chatbot.name" . }}-student-keys
  labels:
{{ include "lab-chatbot.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "lab-chatbot.name" . }}-student-keys
subjects:
  - kind: ServiceAccount
    name: {{ include "lab-chatbot.name" . }}
    namespace: {{ .Release.Namespace }}
