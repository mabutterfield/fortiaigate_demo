# Change 2026-11-19: the chatbot no longer reads or writes Kubernetes Secrets; keys
# come from the gateway's key endpoints. The Role below is kept only while
# legacyKeySecrets is true (old per-namespace lab-keys-*/lab-seed-* model).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lab-chatbot.name" . }}
  labels:
{{ include "lab-chatbot.labels" . | indent 4 }}
{{- if .Values.legacyKeySecrets }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "lab-chatbot.name" . }}-student-keys
  labels:
{{ include "lab-chatbot.labels" . | indent 4 }}
rules:
{{- if .Values.students }}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"]
    resourceNames:
{{- range .Values.students }}
      - {{ printf "%s%s" $.Values.keySecretPrefix . | quote }}
{{- end }}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames:
{{- range .Values.students }}
      - {{ printf "%s%s" $.Values.seedSecretPrefix . | quote }}
{{- end }}
{{- else }}
  []
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "lab-chatbot.name" . }}-student-keys
  labels:
{{ include "lab-chatbot.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "lab-chatbot.name" . }}-student-keys
subjects:
  - kind: ServiceAccount
    name: {{ include "lab-chatbot.name" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
