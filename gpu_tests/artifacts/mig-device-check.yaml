apiVersion: v1
kind: Pod
metadata:
  name: faig-mig-check
  namespace: default
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  containers:
  - name: check
    image: nvidia/cuda:12.8.1-base-ubuntu24.04
    command: ["nvidia-smi", "-L"]
    resources:
      limits:
        nvidia.com/mig-1g.16gb: 2
